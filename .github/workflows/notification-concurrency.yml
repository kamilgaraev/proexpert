name: Notification PostgreSQL Concurrency

on:
  pull_request:
    paths:
      - 'app/BusinessModules/Features/Notifications/**'
      - 'app/Broadcasting/**'
      - 'routes/channels.php'
      - 'tests/Feature/Notifications/**'
      - 'tests/Unit/Notifications/**'
      - 'tests/Unit/Broadcasting/UserChannelTest.php'
      - 'app/BusinessModules/Features/Procurement/**'
      - 'config/RoleDefinitions/**'
      - 'app/BusinessModules/Features/SiteRequests/**'
      - 'app/BusinessModules/Features/BasicWarehouse/**'
      - 'app/BusinessModules/Features/QualityControl/**'
      - 'app/BusinessModules/Features/HandoverAcceptance/**'
      - 'database/migrations/**'
      - 'tests/Feature/Procurement/Reporting/**'
      - 'tests/Support/Procurement/Reporting/**'
      - 'app/BusinessModules/Core/Reporting/**'
      - 'tests/Feature/Reporting/Execution/**'
      - 'tests/Feature/Reporting/SavedViews/**'
      - 'tests/Unit/Reporting/SavedViews/**'
      - 'tests/Feature/Reporting/Publication/**'
      - 'tests/Unit/Reporting/Publication/**'
      - 'tests/Support/Reporting/Publication/**'
      - 'tests/Unit/Reporting/Exports/**'
      - 'tests/Contract/Reporting/ReportExportParityContractTest.php'
      - 'tests/Performance/Reporting/ReportExportStreamingBudgetTest.php'
      - 'tests/Architecture/Reporting/ReportingExecutionBindingsTest.php'
      - 'tests/Feature/QualityControl/Reporting/DefectFlow/**'
      - 'tests/Unit/QualityControl/Reporting/DefectFlow/**'
      - 'tests/Support/Reporting/PostgresProcessRaceHarness.php'
      - 'tests/Architecture/Reporting/ReportPublicationProofSchemaTest.php'
      - 'tests/Fixtures/Reporting/Publication/**'
      - 'docs/reports/contracts/report-publication-proof.v1.schema.json'
      - 'resources/views/reports/exports/canonical-report-pdf.blade.php'
      - 'config/dompdf.php'
      - 'app/Helpers/helpers.php'
      - 'app/Helpers/TranslationHelper.php'
      - 'lang/en/reports.php'
      - 'lang/ru/reports.php'
      - 'lang/ru/permissions.php'
      - 'scripts/issue-report-publication-release.php'
      - 'scripts/reporting/build-r15-publication-candidate.php'
      - 'docs/reports/contracts/r15-candidate-manifest.v1.schema.json'
      - 'docs/reports/contracts/r15-publication-request.v1.schema.json'
      - 'docs/reports/contracts/r15-candidate-conformance.v1.schema.json'
      - 'docs/reports/contracts/r15-candidate-proof-template.v1.schema.json'
      - 'build/reports/publication-release-requests/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/notification-concurrency.yml'
  push:
    branches: [main]
    paths:
      - 'app/BusinessModules/Features/Notifications/**'
      - 'app/Broadcasting/**'
      - 'routes/channels.php'
      - 'tests/Feature/Notifications/**'
      - 'tests/Unit/Notifications/**'
      - 'tests/Unit/Broadcasting/UserChannelTest.php'
      - 'app/BusinessModules/Features/Procurement/**'
      - 'config/RoleDefinitions/**'
      - 'app/BusinessModules/Features/SiteRequests/**'
      - 'app/BusinessModules/Features/BasicWarehouse/**'
      - 'app/BusinessModules/Features/QualityControl/**'
      - 'app/BusinessModules/Features/HandoverAcceptance/**'
      - 'database/migrations/**'
      - 'tests/Feature/Procurement/Reporting/**'
      - 'tests/Support/Procurement/Reporting/**'
      - 'app/BusinessModules/Core/Reporting/**'
      - 'tests/Feature/Reporting/Execution/**'
      - 'tests/Feature/Reporting/SavedViews/**'
      - 'tests/Unit/Reporting/SavedViews/**'
      - 'tests/Feature/Reporting/Publication/**'
      - 'tests/Unit/Reporting/Publication/**'
      - 'tests/Support/Reporting/Publication/**'
      - 'tests/Unit/Reporting/Exports/**'
      - 'tests/Contract/Reporting/ReportExportParityContractTest.php'
      - 'tests/Performance/Reporting/ReportExportStreamingBudgetTest.php'
      - 'tests/Architecture/Reporting/ReportingExecutionBindingsTest.php'
      - 'tests/Feature/QualityControl/Reporting/DefectFlow/**'
      - 'tests/Unit/QualityControl/Reporting/DefectFlow/**'
      - 'tests/Support/Reporting/PostgresProcessRaceHarness.php'
      - 'tests/Architecture/Reporting/ReportPublicationProofSchemaTest.php'
      - 'tests/Fixtures/Reporting/Publication/**'
      - 'docs/reports/contracts/report-publication-proof.v1.schema.json'
      - 'resources/views/reports/exports/canonical-report-pdf.blade.php'
      - 'config/dompdf.php'
      - 'app/Helpers/helpers.php'
      - 'app/Helpers/TranslationHelper.php'
      - 'lang/en/reports.php'
      - 'lang/ru/reports.php'
      - 'lang/ru/permissions.php'
      - 'scripts/issue-report-publication-release.php'
      - 'scripts/reporting/build-r15-publication-candidate.php'
      - 'docs/reports/contracts/r15-candidate-manifest.v1.schema.json'
      - 'docs/reports/contracts/r15-publication-request.v1.schema.json'
      - 'docs/reports/contracts/r15-candidate-conformance.v1.schema.json'
      - 'docs/reports/contracts/r15-candidate-proof-template.v1.schema.json'
      - 'build/reports/publication-release-requests/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/notification-concurrency.yml'

permissions:
  contents: read

jobs:
  notification-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: most_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d most_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: most_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      RUN_NOTIFICATION_POSTGRES_TESTS: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, pcntl, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Resolve Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare database
        run: |
          php artisan migrate --force --path=database/migrations/0001_01_01_000000_create_users_table.php
          php artisan migrate --force --path=database/migrations/2025_01_01_000010_create_organizations_table.php
          php artisan migrate --force --path=database/migrations/2025_05_03_161553_add_fields_to_users_table.php
          php artisan migrate --force --path=app/BusinessModules/Features/Notifications/migrations/2025_10_10_100001_extend_notifications_table.php
          php artisan migrate --force --path=app/BusinessModules/Features/Notifications/migrations/2026_07_15_000001_create_notification_targets_table.php

      - name: Run notification concurrency contract
        run: php vendor/bin/phpunit tests/Feature/Notifications/NotificationPostgresConcurrencyTest.php

  procurement-cycle-postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: most_procurement_cycle_testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d most_procurement_cycle_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: false
      CI: true
      DB_CONNECTION: pgsql
      DB_URL: ''
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: most_procurement_cycle_testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      PROCUREMENT_CYCLE_POSTGRES_TESTS: 1
    steps:
      - name: Checkout exact workflow SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: 8.2
          extensions: mbstring, pcntl, pdo_pgsql, pgsql
          coverage: none
          tools: composer:v2

      - name: Resolve Composer cache
        id: procurement-composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.procurement-composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify exact checkout and PostgreSQL prerequisites
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$DB_URL" = ""
          case "$DB_DATABASE" in *_testing) ;; *) echo "R15 database must end with _testing" >&2; exit 1;; esac
          php -r "if (!in_array('pgsql', PDO::getAvailableDrivers(), true)) { fwrite(STDERR, \"pdo_pgsql is unavailable\\n\"); exit(1); }"
          test -f tests/Feature/Procurement/Reporting/Cycle/ProcurementCycleSourcePostgresTest.php

      - name: Run R15 formula and runtime prerequisites
        run: >-
          php vendor/bin/phpunit
          tests/Unit/Procurement/Reporting/Cycle/ProcurementCycleFormulaTest.php
          tests/Unit/Procurement/Reporting/Cycle/ProcurementCycleRuntimeContractTest.php
          --fail-on-skipped

      - name: Prepare isolated PostgreSQL schema from exact checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          php artisan migrate:fresh --force

      - name: Require process-race prerequisites
        run: >-
          php -r "foreach (['pcntl_fork', 'pcntl_waitpid', 'posix_kill'] as \$function) {
          if (! function_exists(\$function)) { fwrite(STDERR, \"Missing required process-race function: \$function\\n\"); exit(1); }
          }"

      - name: Run procurement-cycle PostgreSQL contract
        run: >-
          php artisan test tests/Feature/Procurement/Reporting/Cycle/ProcurementCycleSourcePostgresTest.php
          --group=postgresql --fail-on-skipped

  procurement-cycle-r15-candidate-evidence:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: procurement-cycle-postgres-contract
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact workflow SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: 8.2
          extensions: dom, mbstring, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate exact R15 candidate evidence
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          export MOST_R15_CI_EVIDENCE=1
          export APP_ENV=testing
          export GITHUB_ACTIONS=true
          php artisan test tests/Unit/Reporting/Conformance/ReportSourceConformanceHarnessTest.php tests/Unit/Procurement/Reporting/Cycle/ProcurementCycleRuntimeContractTest.php tests/Unit/Procurement/Reporting/Cycle/R15CiConformanceArtifactTest.php --no-coverage
          conformance_artifact="$RUNNER_TEMP/r15-conformance-evidence.json"
          php scripts/reporting/generate-r15-conformance-evidence.php > "$conformance_artifact"
          export MOST_R15_CI_EVIDENCE_ARTIFACT="$conformance_artifact"
          php scripts/reporting/build-r15-publication-candidate.php
          php scripts/reporting/build-r15-publication-candidate.php --check
          export MOST_R15_PUBLICATION_FIXTURE_DIR="$GITHUB_WORKSPACE/build/reports/r15-candidate-evidence"
          php vendor/bin/phpunit tests/Unit/Procurement/Reporting/Cycle/ProcurementCycleReleaseCandidateResolverE2ETest.php --fail-on-skipped --no-coverage

      - name: Upload R15 candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r15-candidate-evidence-${{ github.sha }}
          path: build/reports/r15-candidate-evidence/
          if-no-files-found: error
          retention-days: 30

  procurement-cycle-r15-protected-admission:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: procurement-cycle-r15-candidate-evidence
    permissions:
      actions: read
      contents: read
      id-token: write
    environment: r15-publication-admission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact workflow SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: 8.2
          extensions: dom, mbstring, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Download exact same-run R15 candidate evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r15-candidate-evidence-${{ github.sha }}
          path: build/reports/r15-protected-admission/${{ github.sha }}

      - name: Verify protected admission package
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REPOSITORY" = 'kamilgaraev/proexpert'
          test "$GITHUB_REF" = 'refs/heads/main'
          php scripts/reporting/verify-r15-protected-admission.php "build/reports/r15-protected-admission/$GITHUB_SHA"

  report-saved-view-version-postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: most_report_saved_view_version_testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d most_report_saved_view_version_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: false
      CI: true
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: most_report_saved_view_version_testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      REPORT_SAVED_VIEW_VERSION_POSTGRES_TESTS: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, pdo_pgsql, pgsql
          coverage: none
          tools: composer:v2

      - name: Resolve Composer cache
        id: saved-view-version-composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.saved-view-version-composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify checked-out SHA and PostgreSQL prerequisites
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          php -r "if (!in_array('pgsql', PDO::getAvailableDrivers(), true)) { fwrite(STDERR, \"pdo_pgsql is unavailable\\n\"); exit(1); }"
          test -f tests/Feature/Reporting/SavedViews/ReportSavedViewVersionPostgresTest.php

      - name: Prepare isolated PostgreSQL schema
        run: php artisan migrate:fresh --force

      - name: Run saved-view version PostgreSQL contract
        run: >-
          php vendor/bin/phpunit tests/Feature/Reporting/SavedViews/ReportSavedViewVersionPostgresTest.php
          --group=postgresql
          --fail-on-skipped

  report-source-mode-authorization-postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: most_report_source_mode_auth_testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d most_report_source_mode_auth_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: false
      CI: true
      DB_CONNECTION: pgsql
      DB_URL: ''
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: most_report_source_mode_auth_testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      REPORT_SOURCE_MODE_AUTHORIZATION_POSTGRES_TESTS: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, pdo_pgsql, pgsql
          coverage: none
          tools: composer:v2

      - name: Resolve Composer cache
        id: source-mode-authorization-composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.source-mode-authorization-composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify checked-out SHA and PostgreSQL prerequisites
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          php -r "if (!in_array('pgsql', PDO::getAvailableDrivers(), true)) { fwrite(STDERR, \"pdo_pgsql is unavailable\\n\"); exit(1); }"
          test -f tests/Feature/Reporting/Execution/LaravelSourceModeAuthorizationBoundaryTest.php

      - name: Prepare isolated PostgreSQL schema
        run: php artisan migrate:fresh --force

      - name: Run source-mode authorization PostgreSQL contract
        run: >-
          php vendor/bin/phpunit tests/Feature/Reporting/Execution/LaravelSourceModeAuthorizationBoundaryTest.php
          --group=postgresql
          --fail-on-skipped

  report-publication-postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: most_report_publication_testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d most_report_publication_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: false
      CI: true
      DB_CONNECTION: pgsql
      DB_URL: ''
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: most_report_publication_testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      REPORT_PUBLICATION_POSTGRES_TESTS: 1
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: 8.2
          extensions: dom, mbstring, pcntl, pdo_pgsql, pgsql, zip
          coverage: none
          tools: composer:v2

      - name: Resolve Composer cache
        id: publication-composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.publication-composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify checked-out SHA and PostgreSQL prerequisites
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          php -r "foreach (['pcntl_fork', 'pcntl_waitpid', 'posix_kill'] as \$function) { if (!function_exists(\$function)) { fwrite(STDERR, \"Missing required process-race function: \$function\\n\"); exit(1); } }"
          php -r "if (!in_array('pgsql', PDO::getAvailableDrivers(), true)) { fwrite(STDERR, \"pdo_pgsql is unavailable\\n\"); exit(1); }"
          test -f tests/Feature/Reporting/Publication/ReportPublicationRegistryPostgresTest.php

      - name: Run publication unit and proof-schema contracts
        run: >-
          php vendor/bin/phpunit
          tests/Unit/Reporting/Publication
          tests/Architecture/Reporting/ReportPublicationProofSchemaTest.php

      - name: Run real renderer delivery contracts
        run: >-
          php vendor/bin/phpunit
          tests/Unit/Reporting/Exports/CsvReportExportRendererTest.php
          tests/Unit/Reporting/Exports/XlsxReportExportRendererTest.php
          tests/Unit/Reporting/Exports/PdfReportExportRendererTest.php
          tests/Unit/Reporting/Exports/ReportExportRendererRegistryTest.php
          tests/Contract/Reporting/ReportExportParityContractTest.php
          tests/Performance/Reporting/ReportExportStreamingBudgetTest.php
          tests/Architecture/Reporting/ReportingExecutionBindingsTest.php
          tests/Unit/Reporting/Exports/S3ReportArtifactStreamTest.php
          --no-coverage

      - name: Prepare isolated PostgreSQL schema
        run: php artisan migrate:fresh --force

      - name: Run report publication PostgreSQL contract
        run: >-
          php vendor/bin/phpunit tests/Feature/Reporting/Publication/ReportPublicationRegistryPostgresTest.php
          --group=postgresql
          --fail-on-skipped

  report-publication-release-request-discovery:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - procurement-cycle-postgres-contract
      - procurement-cycle-r15-candidate-evidence
      - report-publication-postgres-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_requests: ${{ steps.release-requests.outputs.has_requests }}
    steps:
      - name: Checkout trusted main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Discover registered release requests
        id: release-requests
        run: |
          shopt -s nullglob
          requests=(build/reports/publication-release-requests/*.json)
          for request in "${requests[@]}"; do
            test -f "$request"
            test ! -L "$request"
          done
          if (( ${#requests[@]} == 0 )); then
            echo "has_requests=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_requests=true" >> "$GITHUB_OUTPUT"
          fi

  report-publication-release-artifact:
    if: needs.report-publication-release-request-discovery.outputs.has_requests == 'true'
    needs:
      - report-publication-release-request-discovery
      - procurement-cycle-r15-candidate-evidence
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: report-publication-release
    env:
      REPORT_PUBLICATION_RELEASE_ENVIRONMENT: report-publication-release
    steps:
      - name: Checkout trusted main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download exact same-run R15 candidate evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r15-candidate-evidence-${{ github.sha }}
          path: build/reports/r15-release-trusted-root

      - name: Verify same-run R15 evidence root
        env:
          R15_TRUSTED_ROOT: ${{ github.workspace }}/build/reports/r15-release-trusted-root
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -d "$R15_TRUSTED_ROOT"
          test -f "$R15_TRUSTED_ROOT/r15-candidate-manifest.json"
          test -f "$R15_TRUSTED_ROOT/r15-conformance-evidence.json"
          test -f "$R15_TRUSTED_ROOT/r15-proof-template.json"
          test -f "$R15_TRUSTED_ROOT/r15_release_request.json"
          test ! -L "$R15_TRUSTED_ROOT/r15-candidate-manifest.json"
          test ! -L "$R15_TRUSTED_ROOT/r15-conformance-evidence.json"
          test ! -L "$R15_TRUSTED_ROOT/r15-proof-template.json"
          test ! -L "$R15_TRUSTED_ROOT/r15_release_request.json"
          printf 'MOST_R15_RELEASE_TRUSTED_ROOT=%s\n' "$R15_TRUSTED_ROOT" >> "$GITHUB_ENV"

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: 8.2
          extensions: dom, mbstring, sodium, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify protected release context
        run: |
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = "kamilgaraev/proexpert"
          test "$GITHUB_JOB" = "report-publication-release-artifact"
          test -n "$GITHUB_ACTOR_ID"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Issue and self-verify signed release artifact
        id: issue-release-artifacts
        env:
          REPORT_PUBLICATION_RELEASE_SECRET_KEY_BASE64: ${{ secrets.REPORT_PUBLICATION_RELEASE_SECRET_KEY_BASE64 }}
        run: |
          shopt -s nullglob
          for request in build/reports/publication-release-requests/*.json; do
            php scripts/issue-report-publication-release.php \
              --request="$request" \
              --output-directory=build/reports/signed-publication-releases
          done

      - name: Upload immutable release bundle
        id: upload-release-artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: report-publication-release-${{ github.sha }}
          path: build/reports/signed-publication-releases/
          if-no-files-found: error
          retention-days: 30

  quality-defect-flow-postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: most_quality_defect_flow_testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d most_quality_defect_flow_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: false
      CI: true
      DB_CONNECTION: pgsql
      DB_URL: ''
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: most_quality_defect_flow_testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUALITY_DEFECT_FLOW_POSTGRES_TESTS: 1
    steps:
      - name: Checkout exact workflow SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, pcntl, pdo_pgsql, pgsql, posix
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify exact checkout and PostgreSQL prerequisites
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$DB_URL" = ""
          case "$DB_DATABASE" in *_testing) ;; *) echo "R23 database must end with _testing" >&2; exit 1;; esac
          php -r "if (!in_array('pgsql', PDO::getAvailableDrivers(), true)) { fwrite(STDERR, \"pdo_pgsql is unavailable\\n\"); exit(1); }"
          php -r "foreach (['pcntl_fork', 'pcntl_waitpid', 'posix_kill'] as \$function) { if (!function_exists(\$function)) { fwrite(STDERR, \"Missing required process-race function: \$function\\n\"); exit(1); } }"
          test -f app/BusinessModules/Features/QualityControl/migrations/2026_08_01_000020_create_quality_defect_flow_source.php
          test -f tests/Feature/QualityControl/Reporting/DefectFlow/QualityDefectFlowSourcePostgresTest.php

      - name: Prepare isolated PostgreSQL schema from exact checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          php artisan migrate:fresh --force

      - name: Run quality-defect-flow PostgreSQL contract
        run: >-
          php vendor/bin/phpunit tests/Feature/QualityControl/Reporting/DefectFlow/QualityDefectFlowSourcePostgresTest.php
          --group=postgresql
          --fail-on-skipped
