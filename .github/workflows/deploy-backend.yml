          [[ "${PREPARATION_PINS_SHA256:-}" =~ ^[0-9a-f]{64}$ ]]
      - name: Checkout exact preparation source without persisted credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pin checked exact-main source transport
        id: source
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          PREPARATION_REF: ${{ vars.PUBLIC_CORE_INPUT_PREPARATION_REF }}
          PREPARATION_SHA: ${{ vars.PUBLIC_CORE_INPUT_PREPARATION_SHA }}
          PREPARATION_PINS_SHA256: ${{ vars.PUBLIC_CORE_INPUT_PREPARATION_PINS_SHA256 }}
        shell: bash
        run: |
