              upsert_env YOOKASSA_SECRET_KEY "${YOOKASSA_SECRET_KEY}"
              upsert_env YOOKASSA_TEST_ORGANIZATION_IDS "${YOOKASSA_TEST_ORGANIZATION_IDS:-}"
              upsert_env YOOKASSA_RETURN_URL 'https://1мост.рф/dashboard/billing'
              upsert_env YOOKASSA_WEBHOOK_URL 'https://1мост.рф/api/v1/webhooks/yookassa'
              upsert_env YOOKASSA_RECEIPT_ENABLED false
              upsert_env YOOKASSA_LIVE_ENABLED false
              upsert_env YOOKASSA_LIVE_LEGAL_ENTITY_CONFIRMED false
              upsert_env YOOKASSA_LIVE_CONTRACT_CONFIRMED false
              upsert_env YOOKASSA_LIVE_RECEIPT_SETTINGS_CONFIRMED false
            else
              upsert_env YOOKASSA_MODE disabled
            fi

            prepare_public_core_deny_policy
            prepare_public_core_image_inputs "${IMAGE_REF}" "${RELEASE_SHA}" "${PREVIOUS_RELEASE_SHA}"

            upsert_env MOST_IMAGE_REF "${IMAGE_REF}"
            upsert_env MOST_RELEASE_SHA "${RELEASE_SHA}"
            upsert_env SENTRY_RELEASE "prohelper@${RELEASE_SHA}"
            upsert_env REVERB_APP_KEY "${REVERB_APP_KEY}"
            upsert_env LEGAL_ARCHIVE_SCANNER clamav
            remove_env_key LEGAL_ARCHIVE_AUDIT_PHASE_B_CUTOVER_ENABLED

            ensure_immutable_audit_writer_secret
            ensure_onlyoffice_jwt_secret_alignment
            if ! git diff --quiet "${PREVIOUS_RELEASE_SHA}" "${RELEASE_SHA}" -- deploy/onlyoffice .github/workflows/deploy-backend.yml; then
              apply_onlyoffice_callback_transport
            fi
            docker compose pull clamav
            docker compose up -d clamav
            for attempt in $(seq 1 72); do
              if docker compose exec -T clamav clamdscan --ping 1; then
                break
              fi
              if [ "${attempt}" -eq 72 ]; then
                echo 'ClamAV did not become ready; refusing deployment'
                exit 1
              fi
              sleep 5
            done
            MOST_IMAGE_REF="${IMAGE_REF}" docker compose run --rm --no-deps geometry-worker /usr/local/bin/geometry-runtime-smoke

            systemctl stop nginx
            stop_legacy_supervisor_processes
            stop_legacy_systemd_processes
            stop_legacy_writer_processes
            docker compose stop --timeout 30 ${BACKEND_STOP_SERVICES}
            assert_legacy_runtime_stopped

            MOST_IMAGE_REF="${IMAGE_REF}" docker compose run --rm --no-deps api php artisan migrate:safe --force
            MOST_IMAGE_REF="${IMAGE_REF}" docker compose run --rm --no-deps api php artisan auth:diagnose --clear-cache
            assert_legacy_runtime_stopped
            MOST_IMAGE_REF="${IMAGE_REF}" docker compose run --rm --no-deps -e LEGAL_ARCHIVE_AUDIT_PHASE_B_CUTOVER_ENABLED=true api php artisan immutable-audit:confirm-drain
            assert_legacy_runtime_stopped
            MOST_IMAGE_REF="${IMAGE_REF}" docker compose run --rm --no-deps -e LEGAL_ARCHIVE_AUDIT_PHASE_B_CUTOVER_ENABLED=true api php artisan immutable-audit:phase-b-cutover --confirm-writer-version=2
            assert_legacy_runtime_stopped
            MOST_IMAGE_REF="${IMAGE_REF}" docker compose run --rm --no-deps -e LEGAL_ARCHIVE_AUDIT_PHASE_B_CUTOVER_ENABLED=true api php artisan immutable-audit:confirm-drain
            assert_legacy_runtime_stopped
            MOST_IMAGE_REF="${IMAGE_REF}" docker compose run --rm --no-deps -e LEGAL_ARCHIVE_AUDIT_REPAIR_ENABLED=true api php artisan immutable-audit:repair-invariants --confirm-repair
            MOST_IMAGE_REF="${IMAGE_REF}" docker compose run --rm --no-deps api php artisan immutable-audit:writer-readiness
            MOST_PUBLIC_CORE_STAGED_API=''
            # Image input preparation may install wrappers; full invalidation holds them null until publication.
            invalidate_public_core_projections
            intake_public_core_current_candidate "${IMAGE_REF}" "${RELEASE_SHA}" "${CURRENT_CANDIDATE_REVISION}" "${CURRENT_CANDIDATE_SHA256}"
            stage_public_core_approved_runtime "${IMAGE_REF}" "${RELEASE_SHA}"
            resume_public_core_backend_writers "${IMAGE_REF}" "${BACKEND_SERVICES}"
            ensure_onlyoffice_api_runtime_jwt_secret_alignment
            if grep -q '^ESTIMATE_COMPLETENESS_ARBITER_ENABLED=true$' .env; then
              docker compose exec -T api php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); exit(config("estimate-generation.completeness_arbiter.enabled") === true ? 0 : 1);'
              docker compose exec -T horizon php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); exit(config("estimate-generation.completeness_arbiter.enabled") === true ? 0 : 1);'
            fi

            for attempt in $(seq 1 24); do
              verify_public_core_staged_tuple
              if docker compose exec -T api curl -fsS http://localhost:8000/ready >/dev/null \
                && docker compose exec -T api curl -fsS http://localhost:8000/up >/dev/null \
                && docker compose exec -T websockets php -r 'exit(@fsockopen("127.0.0.1", 8080) ? 0 : 1);' \
                && docker compose exec -T clamav clamdscan --ping 1 \
                && docker compose exec -T geometry-worker /usr/local/bin/geometry-runtime-smoke; then
                docker compose exec -T api php artisan assets:backfill --format=json
                docker compose exec -T api php artisan assets:reconcile --format=json || true
                docker compose exec -T api php artisan assets:verify-cutover --format=json --details || true
                docker compose exec -T scheduler tail -n 24 storage/logs/asset-registry-cutover.log || true
                verify_public_core_staged_tuple
                systemctl start nginx
                systemctl is-active --quiet nginx
                verify_public_core_staged_tuple
                trap - ERR
                echo "Backend deployment successful: ${IMAGE_REF}"
                exit 0
              fi
              sleep 5
            done

            docker compose logs --tail=200 api
            docker compose logs --tail=200 websockets
            docker compose logs --tail=200 horizon
            docker compose logs --tail=200 geometry-worker
            exit 1

  model_input:
    needs: release_mode
    if: needs.release_mode.outputs.input_allowed == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'input-only'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: prod-backend-deploy
      cancel-in-progress: false
    steps:
      - name: Validate literal main input-only before managed credentials
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          INPUT_IMAGE_REF: ${{ inputs.input_image_ref }}
          PREPARATION_REF: ${{ vars.PUBLIC_CORE_INPUT_PREPARATION_REF }}
          PREPARATION_SHA: ${{ vars.PUBLIC_CORE_INPUT_PREPARATION_SHA }}
          PREPARATION_PINS_SHA256: ${{ vars.PUBLIC_CORE_INPUT_PREPARATION_PINS_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME:-}" = workflow_dispatch
          test "${GITHUB_REF:-}" = refs/heads/main
          test "${REQUESTED_MODE:-}" = input-only
          [[ "${EXPECTED_SOURCE_SHA:-}" =~ ^[0-9a-f]{40}$ ]]
          test "${EXPECTED_SOURCE_SHA:-}" = "${GITHUB_SHA:-}"
          [[ "${PREPARATION_REF:-}" =~ ^ref_[0-9a-f]{32}$ ]]
          [[ "${PREPARATION_SHA:-}" =~ ^[0-9a-f]{40}$ ]]
          test "${PREPARATION_SHA:-}" = "${GITHUB_SHA:-}"
          [[ "${PREPARATION_PINS_SHA256:-}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${INPUT_IMAGE_REF:-}" =~ ^ghcr\.io/kamilgaraev/proexpert/prohelper@sha256:[0-9a-f]{64}$ ]]
      - name: Checkout exact input source without persisted credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pin checked exact-main source transport
        id: source
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          PREPARATION_REF: ${{ vars.PUBLIC_CORE_INPUT_PREPARATION_REF }}
          PREPARATION_SHA: ${{ vars.PUBLIC_CORE_INPUT_PREPARATION_SHA }}
          PREPARATION_PINS_SHA256: ${{ vars.PUBLIC_CORE_INPUT_PREPARATION_PINS_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCONTEXT'
          import hashlib,os,pathlib,re,subprocess,tarfile
          sha=os.environ['GITHUB_SHA']; assert re.fullmatch('[0-9a-f]{40}',sha)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==sha
          assert not subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).strip()
          paths=['deploy/backend-runtime-allowlist.sh','docker/public-core/runtime.php','app/BusinessModules/Features/AIAssistant/config/ai-assistant.php','app/Support/AI/LunaModelPolicy.php','app/BusinessModules/Features/AIAssistant/Services/LLM/TimewebProvider.php','.github/workflows/deploy-backend.yml','Dockerfile.prod','.dockerignore']
          assert all(pathlib.Path(v).is_file() and not pathlib.Path(v).is_symlink() for v in paths)
          pins=':'.join(hashlib.sha256(pathlib.Path(v).read_bytes()).hexdigest() for v in paths)
          assert hashlib.sha256(pins.encode()).hexdigest()==os.environ['PREPARATION_PINS_SHA256']
          assert os.environ['PREPARATION_SHA']==sha and re.fullmatch('ref_[0-9a-f]{32}',os.environ['PREPARATION_REF'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('pins='+pins+'\n')
          if os.environ['REQUESTED_MODE']=='input-prepare':
           root=pathlib.Path(os.environ['RUNNER_TEMP'])/('most-input-prepare-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'])
           root.mkdir(mode=0o700);context=root/'context';context.mkdir(mode=0o700);archive=root/'source.tar'
           subprocess.run(['git','archive','--format=tar','--output',str(archive),sha],check=True)
           with tarfile.open(archive) as tar:
            for member in tar.getmembers():
             path=pathlib.PurePosixPath(member.name);name=path.name
             assert not path.is_absolute() and '..' not in path.parts and (member.isfile() or member.isdir() or member.issym())
             assert not (name=='.env' or (name.startswith('.env.') and name!='.env.example') or name in ['.npmrc','.netrc','auth.json','id_rsa','id_ed25519'] or path.suffix.lower() in ['.pem','.key','.p12','.pfx'])
             if member.issym():assert (context/path.parent/member.linkname).resolve().is_relative_to(context.resolve())
           subprocess.run(['tar','-xf',str(archive),'-C',str(context)],check=True)
           # Preserve export-ignore; add only the independently pinned literal workflow blob.
           workflow_source=subprocess.run(['git','show',sha+':.github/workflows/deploy-backend.yml'],check=True,stdout=subprocess.PIPE).stdout
           assert hashlib.sha256(workflow_source).hexdigest()==pins.split(':')[5]
           directory_flags=os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW
           owned_fds=[]
           try:
            root_fd=os.open(root,directory_flags);owned_fds.append(root_fd)
            context_fd=os.open('context',directory_flags,dir_fd=root_fd);owned_fds.append(context_fd)
            for fd in [root_fd,context_fd]:
             st=os.fstat(fd);assert st.st_uid==os.geteuid() and st.st_mode&0o022==0
            os.mkdir('.github',mode=0o700,dir_fd=context_fd)
            github_fd=os.open('.github',directory_flags,dir_fd=context_fd);owned_fds.append(github_fd)
            os.mkdir('workflows',mode=0o700,dir_fd=github_fd)
            workflows_fd=os.open('workflows',directory_flags,dir_fd=github_fd);owned_fds.append(workflows_fd)
            flags=os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW
            with os.fdopen(os.open('deploy-backend.yml',flags,0o600,dir_fd=workflows_fd),'wb') as workflow_file:
             assert workflow_file.write(workflow_source)==len(workflow_source)
           finally:
            for fd in reversed(owned_fds):os.close(fd)
           assert set(['/.git','/.env','/.env.*','/vendor','/node_modules','/storage/*.key']).issubset((context/'.dockerignore').read_text().splitlines())
           missing=[v for v in paths if not (context/v).is_file() or (context/v).is_symlink()]
           assert not missing,'required context file missing or non-regular/symlink: '+','.join(missing)
           assert ':'.join(hashlib.sha256((context/v).read_bytes()).hexdigest() for v in paths)==pins
           with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('context='+str(context)+'\n')
          PYCONTEXT
      - name: Describe pinned staged input through existing managed custodian
        uses: appleboy/ssh-action@v1.0.3
        env:
          INPUT_SHA: ${{ github.sha }}
          INPUT_IMAGE_REF: ${{ inputs.input_image_ref }}
          INPUT_PINS: ${{ steps.source.outputs.pins }}
          PREPARATION_REF: ${{ vars.PUBLIC_CORE_INPUT_PREPARATION_REF }}
          PREPARATION_SHA: ${{ vars.PUBLIC_CORE_INPUT_PREPARATION_SHA }}
          PREPARATION_PINS_SHA256: ${{ vars.PUBLIC_CORE_INPUT_PREPARATION_PINS_SHA256 }}
          MANAGED_REF: ${{ github.ref }}
          MANAGED_EVENT: ${{ github.event_name }}
          MANAGED_MODE: ${{ inputs.mode }}
          MANAGED_EXPECTED_SHA: ${{ inputs.expected_source_sha }}
        with:
          host: 89.169.44.117
          username: root
          key: ${{ secrets.DEPLOY }}
          envs: INPUT_SHA,INPUT_IMAGE_REF,INPUT_PINS,PREPARATION_REF,PREPARATION_SHA,PREPARATION_PINS_SHA256,MANAGED_REF,MANAGED_EVENT,MANAGED_MODE,MANAGED_EXPECTED_SHA
          command_timeout: 180s
          script_stop: true
          script: |
            set -euo pipefail
            # BEGIN fixed input transport. Mirrored literally in the managed workflow BEFORE
            # sourcing any extracted helper. Authority is the separately checked CI assignment
            # and exact-main pins, never a supplied staging manifest or a verified status enum.
            public_core_input_assignment_guard() {
              local release="$1" pins="$2" assignment="$3" accepted="$4" expected_pins="$5" digest
              [ "${MANAGED_REF:-}" = refs/heads/main ] && [ "${MANAGED_EVENT:-}" = workflow_dispatch ] || return 1
              case "${MANAGED_MODE:-}" in input-prepare|input-only) ;; *) return 1 ;; esac
              [[ "${release}" =~ ^[0-9a-f]{40}$ ]] && [ "${release}" = "${accepted}" ] && [ "${release}" = "${MANAGED_EXPECTED_SHA:-}" ] || return 1
              [[ "${assignment}" =~ ^ref_[0-9a-f]{32}$ ]] && [[ "${expected_pins}" =~ ^[0-9a-f]{64}$ ]] || return 1
              [[ "${pins}" =~ ^[0-9a-f]{64}(:[0-9a-f]{64}){7}$ ]] || return 1
              digest="$(printf '%s' "${pins}" | sha256sum)" || return 1
              [ "${digest%% *}" = "${expected_pins}" ] || return 1
            }

            public_core_input_image_identity() {
              local image="$1" release="$2" runtime="$3" id revision digests embedded
              [[ "${image}" =~ ^ghcr\.io/kamilgaraev/proexpert/prohelper@sha256:[0-9a-f]{64}$ ]] || return 1
              id="$(docker image inspect --format '{{.Id}}' "${image}" 2>/dev/null)" || return 1
              [[ "${id}" =~ ^sha256:[0-9a-f]{64}$ ]] || return 1
              revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${image}" 2>/dev/null)" || return 1
              [ "${revision}" = "${release}" ] || return 1
              # Read only the expected same-repository digest, never unrelated image aliases.
              digests="$(docker image inspect --format "{{range .RepoDigests}}{{if eq . \"${image}\"}}{{print .}}{{end}}{{end}}" "${image}" 2>/dev/null)" || return 1
              [ "${digests}" = "${image}" ] || return 1
              embedded="$(timeout --signal=TERM --kill-after=5s 45s docker run --pull never --rm --network none --read-only --cap-drop ALL \
                --security-opt no-new-privileges --user 0:0 --log-driver none --entrypoint php "${image}" -r \
                '$r=json_decode(file_get_contents("/etc/most/release.json"),true,8,JSON_THROW_ON_ERROR);echo ($r["sha"]??"")."|".hash_file("sha256","docker/public-core/runtime.php");' 2>/dev/null)" || return 1
              [ "${embedded}" = "${release}|${runtime}" ] || return 1
              printf '%s' "${id}"
            }

            # Fixed, flat stage: five source files plus our bounded tuple, no caller paths.
            # Stable reads/ancestor ownership and full directory equality reject foreign or
            # mutable files. The tuple is compared to external CI pins on EVERY use.
            public_core_input_stage_check() {
              python3 - "$@" <<'PYSTAGE'
            import sys,os,pathlib,stat,hashlib,json,re
            try:
             mode,release,image,image_id,pins,assignment=sys.argv[1:]
             assert mode in ['write','read','parent'] and re.fullmatch('[0-9a-f]{40}',release)
             assert re.fullmatch('ghcr.io/kamilgaraev/proexpert/prohelper@sha256:[0-9a-f]{64}',image)
             assert re.fullmatch('sha256:[0-9a-f]{64}',image_id) and re.fullmatch('ref_[0-9a-f]{32}',assignment)
             hashes=pins.split(':'); assert len(hashes)==8 and all(re.fullmatch('[0-9a-f]{64}',v) for v in hashes)
             root=pathlib.Path('/etc/most/public-core/input-source'); stage=root/release
             def stable(s):return (s.st_dev,s.st_ino,s.st_mode,s.st_uid,s.st_gid,s.st_size,s.st_mtime_ns,s.st_ctime_ns)
             def directory(p,exact=False):
              s=p.lstat(); assert stat.S_ISDIR(s.st_mode) and s.st_uid==0 and s.st_gid==0 and not s.st_mode&0o022
              if exact:assert stat.S_IMODE(s.st_mode)==0o700
              return stable(s)
             for a in [pathlib.Path('/'),pathlib.Path('/etc'),pathlib.Path('/etc/most'),pathlib.Path('/etc/most/public-core'),root]:directory(a)
             if mode=='parent':sys.exit(0)
             initial=directory(stage,True)
             names=['allowlist.sh','runtime.php','config.php','policy.php','provider.php']
             assert set(os.listdir(stage))==set(names+(['source.json'] if mode=='read' else []))
             def read(name,limit):
              path=stage/name; s=path.lstat(); assert stat.S_ISREG(s.st_mode) and s.st_uid==0 and s.st_gid==0 and stat.S_IMODE(s.st_mode)==0o600 and 0<s.st_size<=limit
              fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW)
              with os.fdopen(fd,'rb') as f:
               assert stable(os.fstat(f.fileno()))==stable(s); raw=f.read(limit+1); assert stable(os.fstat(f.fileno()))==stable(s)
              assert len(raw)==s.st_size and stable(path.lstat())==stable(s)
              return raw
             for name,expected in zip(names,hashes[:5]):assert hashlib.sha256(read(name,2*1024*1024)).hexdigest()==expected
             tuple={'schemaVersion':'public-core-input-source/1','sourceSha':release,'imageRef':image,'imageId':image_id,'assignmentRef':assignment,'sourcePins':hashes}
             if mode=='read':
              def unique(pairs):
               d={}
               for k,v in pairs:
                assert k not in d; d[k]=v
               return d
              assert json.loads(read('source.json',4096),object_pairs_hook=unique)==tuple
             else:
              raw=json.dumps(tuple,separators=(',',':')).encode(); assert len(raw)<=4096
              fd=os.open(stage/'source.json',os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
              with os.fdopen(fd,'wb') as f:f.write(raw);f.flush();os.fsync(f.fileno())
             # Directory changes only by our exclusive manifest creation in write mode.
             if mode=='read':assert directory(stage,True)==initial
             for name,expected in zip(names,hashes[:5]):assert hashlib.sha256(read(name,2*1024*1024)).hexdigest()==expected
             print(hashlib.sha256(json.dumps(tuple,separators=(',',':')).encode()).hexdigest())
            except Exception:sys.exit(1)
            PYSTAGE
            }

            validate_public_core_input_source() {
              local image="$1" release="$2" pins="$3" assignment="$4" accepted="$5" expected_pins="$6" image_id
              public_core_input_assignment_guard "${release}" "${pins}" "${assignment}" "${accepted}" "${expected_pins}" || return 1
              local helper runtime config policy provider workflow dockerfile ignore
              IFS=: read -r helper runtime config policy provider workflow dockerfile ignore <<< "${pins}"
              image_id="$(public_core_input_image_identity "${image}" "${release}" "${runtime}")" || return 1
              public_core_input_stage_check read "${release}" "${image}" "${image_id}" "${pins}" "${assignment}" || return 1
            }

            validate_public_core_input_source "${INPUT_IMAGE_REF}" "${INPUT_SHA}" "${INPUT_PINS}" "${PREPARATION_REF}" "${PREPARATION_SHA}" "${PREPARATION_PINS_SHA256}" >/dev/null || exit 1
            # Sourcing is legal only after independent literal validator/CI tuple and byte pins.
            exec 3<"/etc/most/public-core/input-source/${INPUT_SHA}/allowlist.sh" || exit 1
            helper_hash="$(sha256sum /proc/self/fd/3)" || exit 1
            test "${helper_hash%% *}" = "${INPUT_PINS%%:*}"
            source /proc/self/fd/3 || exit 1
            exec 3<&- || exit 1
            describe_managed_model_input "${INPUT_IMAGE_REF}" "${INPUT_SHA}" "${INPUT_PINS}" "${PREPARATION_REF}" "${PREPARATION_SHA}" "${PREPARATION_PINS_SHA256}"

  model_input_prepare:
    needs: release_mode
