name: Deploy Backend to Production

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'artisan'
      - 'bootstrap/**'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'config/**'
      - 'database/**'
      - 'Dockerfile.prod'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'docker/**'
      - 'deploy/**'
      - 'lang/**'
      - 'monitoring/**'
      - 'public/**'
      - 'resources/**'
      - 'routes/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Release from main, or credential-free image qualification only
        type: choice
        required: true
        default: release
        options: [release, qualification-only, input-only]
      expected_source_sha:
        description: Full exact source SHA required for qualification-only or input-only mode
        type: string
        required: false
        default: ''
      input_image_ref:
        description: Existing exact-source immutable image for input-only; no build or pull
        type: string
        required: false
        default: ''

jobs:
  release_mode:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    outputs:
      allowed: ${{ steps.guard.outputs.allowed }}
      input_allowed: ${{ steps.guard.outputs.input_allowed }}
    steps:
      - name: Select literal main release without credentials
        id: guard
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          allowed=false
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$REQUESTED_MODE" != qualification-only ]; then
            case "$GITHUB_EVENT_NAME" in
              push) allowed=true ;;
              workflow_dispatch) if [ "$REQUESTED_MODE" = release ]; then allowed=true; fi ;;
            esac
          fi
          input_allowed=false
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$REQUESTED_MODE" = input-only ] \
            && [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "$EXPECTED_SOURCE_SHA" = "$GITHUB_SHA" ]; then
            input_allowed=true
          fi
          printf 'allowed=%s\ninput_allowed=%s\n' "$allowed" "$input_allowed" >> "$GITHUB_OUTPUT"

  deploy:
    needs: release_mode
    if: needs.release_mode.outputs.allowed == 'true' && github.ref == 'refs/heads/main' && inputs.mode != 'qualification-only' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release'))
    permissions:
      contents: read
      packages: write
    concurrency:
      group: prod-backend-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Enforce exact main release mode before credentials
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$REQUESTED_MODE" != qualification-only
          case "$GITHUB_EVENT_NAME" in
            push) ;;
            workflow_dispatch) test "$REQUESTED_MODE" = release ;;
            *) exit 1 ;;
          esac

      - name: Checkout exact release
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Derive image metadata
        id: meta
        run: |
          echo "release_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_repo=ghcr.io/${GITHUB_REPOSITORY}/prohelper" >> "$GITHUB_OUTPUT"

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          build-args: |
            MOST_RELEASE_SHA=${{ github.sha }}
          cache-from: |
            type=gha,scope=most-backend-prod
            type=gha
          cache-to: type=gha,scope=most-backend-prod,mode=max
          tags: |
            ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.release_sha }}

      - name: Deploy exact image digest
        uses: appleboy/ssh-action@v1.0.3
        env:
          YOOKASSA_SHOP_ID: ${{ secrets.YOOKASSA_SHOP_ID }}
          YOOKASSA_SECRET_KEY: ${{ secrets.YOOKASSA_SECRET_KEY }}
          YOOKASSA_TEST_ORGANIZATION_IDS: ${{ secrets.YOOKASSA_TEST_ORGANIZATION_IDS }}
        with:
          host: 89.169.44.117
          username: root
          key: ${{ secrets.DEPLOY }}
          timeout: 3h
          command_timeout: 3h
          envs: YOOKASSA_SHOP_ID,YOOKASSA_SECRET_KEY,YOOKASSA_TEST_ORGANIZATION_IDS
          script: |
            set -euo pipefail
            umask 077
            RELEASE_SHA="${{ steps.meta.outputs.release_sha }}"
            IMAGE_REPO="${{ steps.meta.outputs.image_repo }}"
            IMAGE_DIGEST="${{ steps.build.outputs.digest }}"
            IMAGE_REF="${IMAGE_REPO}@${IMAGE_DIGEST}"
            REVERB_APP_KEY="${{ secrets.REVERB_APP_KEY }}"

            [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
            [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "${REVERB_APP_KEY}" =~ ^[0-9a-f]{64}$ ]]

            cd /var/www/prohelper
            PREVIOUS_RELEASE_SHA="$(git rev-parse HEAD)"
            git fetch origin "${RELEASE_SHA}"
            git reset --hard "${RELEASE_SHA}"
            test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
            source .github/scripts/atomic-env.sh
            source deploy/backend-runtime-allowlist.sh
            BACKEND_SERVICES="${MOST_COMPOSE_WRITER_SERVICES[*]}"
            BACKEND_STOP_SERVICES="${MOST_COMPOSE_STOP_SERVICES[*]}"
            trap cleanup_deployment_temporary_files EXIT
            initialize_secure_env
            prepare_public_core_inactive_runtime

            ensure_immutable_audit_writer_secret() {
              local current_secret=''
              local secret_lines=0
              local unique_characters=0
              secret_lines="$(grep -c '^LEGAL_ARCHIVE_AUDIT_WRITER_SECRET=' .env || true)"
              if [ "${secret_lines}" -gt 1 ]; then
                echo 'Immutable audit writer secret is declared more than once; refusing deployment'
                return 1
              fi
              if grep -q '^LEGAL_ARCHIVE_AUDIT_WRITER_SECRET=' .env; then
                current_secret="$(grep -m1 '^LEGAL_ARCHIVE_AUDIT_WRITER_SECRET=' .env | cut -d= -f2-)"
              fi
              if [ -n "${current_secret}" ]; then
                unique_characters="$(printf '%s' "${current_secret}" | fold -w1 | sort -u | wc -l)"
                if [ "${#current_secret}" -lt 32 ] || [ "${unique_characters}" -lt 12 ]; then
                  unset current_secret
                  echo 'Immutable audit writer secret is configured but weak; refusing deployment'
                  return 1
                fi
                unset current_secret
                return 0
              fi
              current_secret="$(openssl rand -hex 32)"
              test "${#current_secret}" -eq 64
              upsert_env LEGAL_ARCHIVE_AUDIT_WRITER_SECRET "${current_secret}"
              unset current_secret
            }

            ensure_onlyoffice_jwt_secret_alignment() {
              local backend_enabled backend_secret editor_enabled_lines onlyoffice_runtime_secret onlyoffice_secret root_env_file
              editor_enabled_lines="$(grep -c '^LEGAL_DOCUMENT_EDITOR_ENABLED=' .env || true)"
              if [ "${editor_enabled_lines}" -ne 1 ]; then
                echo 'OnlyOffice editor configuration is missing, duplicated or invalid; refusing deployment'
                return 1
              fi
              backend_enabled="$(grep -m1 '^LEGAL_DOCUMENT_EDITOR_ENABLED=' .env | cut -d= -f2- || true)"
              backend_enabled="$(printf '%s' "${backend_enabled}" | sed -E "s/^['\"]//; s/['\"]$//; s/^[[:space:]]+//; s/[[:space:]]+$//")"
              backend_enabled="$(printf '%s' "${backend_enabled}" | tr '[:upper:]' '[:lower:]')"
              case "${backend_enabled}" in
                '1'|'true'|'on'|'yes') ;;
                '0'|'false'|'off'|'no'|'') return 0 ;;
                *)
                  echo 'OnlyOffice editor configuration is missing, duplicated or invalid; refusing deployment'
                  return 1
                  ;;
              esac
              if [ ! -f deploy/onlyoffice/.env ]; then
                echo 'OnlyOffice environment file is missing while the editor is enabled; refusing deployment'
                return 1
              fi
              if [ "$(grep -c '^LEGAL_DOCUMENT_EDITOR_JWT_SECRET=' .env || true)" -ne 1 ] \
                || [ "$(grep -c '^ONLYOFFICE_JWT_SECRET=' deploy/onlyoffice/.env || true)" -ne 1 ]; then
                echo 'OnlyOffice JWT secret configuration is missing or duplicated; refusing deployment'
                return 1
              fi
              backend_secret="$(grep -m1 '^LEGAL_DOCUMENT_EDITOR_JWT_SECRET=' .env | cut -d= -f2-)"
              backend_secret="$(printf '%s' "${backend_secret}" | sed -E "s/^['\"]//; s/['\"]$//")"
              root_env_file="${ENV_FILE}"
              ENV_FILE="deploy/onlyoffice/.env"
              ENV_TEMP_FILE=''
              ENV_EXPECTED_UID=''
              ENV_EXPECTED_GID=''
              initialize_secure_env
              onlyoffice_secret="$(grep -m1 '^ONLYOFFICE_JWT_SECRET=' deploy/onlyoffice/.env | cut -d= -f2-)"
              onlyoffice_secret="$(printf '%s' "${onlyoffice_secret}" | sed -E "s/^['\"]//; s/['\"]$//")"
              ENV_FILE="${root_env_file}"
              ENV_TEMP_FILE=''
              ENV_EXPECTED_UID=''
              ENV_EXPECTED_GID=''
              initialize_secure_env
              if [ "$(docker inspect -f '{{.State.Running}}' most-onlyoffice 2>/dev/null || true)" != 'true' ]; then
                unset backend_secret onlyoffice_secret
                echo 'OnlyOffice JWT secrets or running container differ; refusing deployment'
                return 1
              fi
              onlyoffice_runtime_secret="$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' most-onlyoffice 2>/dev/null | awk -F= '$1=="JWT_SECRET" {sub(/^[^=]*=/, ""); print; exit}')"
              if [ -z "${backend_secret}" ] || [ -z "${onlyoffice_secret}" ] || [ -z "${onlyoffice_runtime_secret}" ] \
                || [ "${backend_secret}" != "${onlyoffice_secret}" ] || [ "${backend_secret}" != "${onlyoffice_runtime_secret}" ]; then
                unset backend_secret onlyoffice_secret onlyoffice_runtime_secret
                echo 'OnlyOffice JWT secrets or running container differ; refusing deployment'
                return 1
              fi
              unset backend_secret onlyoffice_secret onlyoffice_runtime_secret
            }

            ensure_onlyoffice_api_runtime_jwt_secret_alignment() {
              local backend_enabled api_runtime_secret editor_enabled_lines onlyoffice_runtime_secret
              editor_enabled_lines="$(grep -c '^LEGAL_DOCUMENT_EDITOR_ENABLED=' .env || true)"
              if [ "${editor_enabled_lines}" -ne 1 ]; then
                echo 'OnlyOffice editor configuration is missing, duplicated or invalid; refusing deployment'
                return 1
              fi
              backend_enabled="$(grep -m1 '^LEGAL_DOCUMENT_EDITOR_ENABLED=' .env | cut -d= -f2- || true)"
              backend_enabled="$(printf '%s' "${backend_enabled}" | sed -E "s/^['\"]//; s/['\"]$//; s/^[[:space:]]+//; s/[[:space:]]+$//")"
              backend_enabled="$(printf '%s' "${backend_enabled}" | tr '[:upper:]' '[:lower:]')"
              case "${backend_enabled}" in
                '1'|'true'|'on'|'yes') ;;
                '0'|'false'|'off'|'no'|'') return 0 ;;
                *)
                  echo 'OnlyOffice editor configuration is missing, duplicated or invalid; refusing deployment'
                  return 1
                  ;;
              esac
              if [ "$(docker inspect -f '{{.State.Running}}' prohelper-api 2>/dev/null || true)" != 'true' ] \
                || [ "$(docker inspect -f '{{.State.Running}}' most-onlyoffice 2>/dev/null || true)" != 'true' ]; then
                echo 'OnlyOffice JWT secrets or running containers differ; refusing deployment'
                return 1
              fi
              api_runtime_secret="$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' prohelper-api 2>/dev/null | awk -F= '$1=="LEGAL_DOCUMENT_EDITOR_JWT_SECRET" {sub(/^[^=]*=/, ""); print; exit}')"
              onlyoffice_runtime_secret="$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' most-onlyoffice 2>/dev/null | awk -F= '$1=="JWT_SECRET" {sub(/^[^=]*=/, ""); print; exit}')"
              if [ -z "${api_runtime_secret}" ] || [ -z "${onlyoffice_runtime_secret}" ] \
                || [ "${api_runtime_secret}" != "${onlyoffice_runtime_secret}" ]; then
                unset api_runtime_secret onlyoffice_runtime_secret
                echo 'OnlyOffice JWT secrets or running containers differ; refusing deployment'
                return 1
              fi
              unset api_runtime_secret onlyoffice_runtime_secret
            }

            apply_onlyoffice_callback_transport() {
              local backend_enabled callback_base_url callback_host editor_enabled_lines editor_url editor_host allowed_hosts root_env_file
              editor_enabled_lines="$(grep -c '^LEGAL_DOCUMENT_EDITOR_ENABLED=' .env || true)"
              if [ "${editor_enabled_lines}" -ne 1 ]; then
                echo 'OnlyOffice editor configuration is missing, duplicated or invalid; refusing deployment'
                return 1
              fi
              backend_enabled="$(grep -m1 '^LEGAL_DOCUMENT_EDITOR_ENABLED=' .env | cut -d= -f2- || true)"
              backend_enabled="$(printf '%s' "${backend_enabled}" | sed -E "s/^['\"]//; s/['\"]$//; s/^[[:space:]]+//; s/[[:space:]]+$//")"
              backend_enabled="$(printf '%s' "${backend_enabled}" | tr '[:upper:]' '[:lower:]')"
              case "${backend_enabled}" in
                '1'|'true'|'on'|'yes') ;;
                '0'|'false'|'off'|'no'|'') return 0 ;;
                *)
                  echo 'OnlyOffice editor configuration is missing, duplicated or invalid; refusing deployment'
                  return 1
                  ;;
              esac
              callback_base_url="$(grep -m1 '^LEGAL_DOCUMENT_EDITOR_CALLBACK_BASE_URL=' .env | cut -d= -f2- || true)"
              if [ -z "${callback_base_url}" ]; then
                callback_base_url="$(grep -m1 '^APP_URL=' .env | cut -d= -f2- || true)"
              fi
              callback_base_url="$(printf '%s' "${callback_base_url}" | sed -E "s/^['\"]//; s/['\"]$//")"
              if [[ "${callback_base_url}" != https://* ]]; then
                echo 'OnlyOffice callback base URL must use HTTPS; refusing deployment'
                return 1
              fi
              callback_host="${callback_base_url#https://}"
              callback_host="${callback_host%%/*}"
              if [[ ! "${callback_host}" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$ ]]; then
                echo 'OnlyOffice callback URL must contain a DNS hostname without a port; refusing deployment'
                return 1
              fi

              editor_url="$(grep -m1 '^LEGAL_DOCUMENT_EDITOR_URL=' .env | cut -d= -f2- || true)"
              editor_url="$(printf '%s' "${editor_url}" | sed -E "s/^['\"]//; s/['\"]$//")"
              if [[ "${editor_url}" != https://* ]]; then
                echo 'OnlyOffice editor URL must use HTTPS; refusing deployment'
                return 1
              fi
              editor_host="${editor_url#https://}"
              editor_host="${editor_host%%/*}"
              if [[ ! "${editor_host}" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$ ]]; then
                echo 'OnlyOffice editor URL must contain a DNS hostname without a port; refusing deployment'
                return 1
              fi
              allowed_hosts="$(grep -m1 '^LEGAL_DOCUMENT_EDITOR_DOWNLOAD_ALLOWED_HOSTS=' .env | cut -d= -f2- || true)"
              allowed_hosts="$(printf '%s' "${allowed_hosts}" | sed -E "s/^['\"]//; s/['\"]$//" | tr -d '[:space:]')"
              case ",${allowed_hosts}," in
                *,"${editor_host}",*) ;;
                *) upsert_env LEGAL_DOCUMENT_EDITOR_DOWNLOAD_ALLOWED_HOSTS "${allowed_hosts:+${allowed_hosts},}${editor_host}" ;;
              esac

              root_env_file="${ENV_FILE}"
              ENV_FILE="deploy/onlyoffice/.env"
              ENV_TEMP_FILE=''
              ENV_EXPECTED_UID=''
              ENV_EXPECTED_GID=''
              initialize_secure_env
              upsert_env ONLYOFFICE_CALLBACK_HOST "${callback_host}"
              (
                cd deploy/onlyoffice
                docker compose config --quiet
                docker compose up -d --force-recreate onlyoffice
                docker compose ps --status running -q onlyoffice | grep -qx '.\+'
                docker exec most-onlyoffice curl -fsS -o /dev/null --connect-timeout 10 --max-time 20 "https://${callback_host}/"
              )
              ENV_FILE="${root_env_file}"
              ENV_TEMP_FILE=''
              ENV_EXPECTED_UID=''
              ENV_EXPECTED_GID=''
              initialize_secure_env
            }

            stop_legacy_supervisor_processes() {
              local supervisor_status
              local program
              supervisor_status="$(supervisorctl status 2>/dev/null || true)"
              while read -r program; do
                [ -n "${program}" ] && supervisorctl stop "${program}" 2>/dev/null || true
              done < <(awk -v pattern="${MOST_SUPERVISOR_WRITER_PROGRAM_PATTERN}" '$1 ~ pattern { print $1 }' <<< "${supervisor_status}")
            }

            stop_legacy_systemd_processes() {
              local unit unit_state
              for unit in "${MOST_SYSTEMD_WRITER_UNITS[@]}"; do
                if ! systemd_unit_exists "${unit}"; then
                  continue
                fi
                unit_state="$(systemctl is-enabled "${unit}" 2>/dev/null || true)"
                if [[ "${unit_state}" =~ ^(masked(-runtime)?|disabled)$ ]]; then
                  continue
                fi
                systemctl mask --runtime --now "${unit}"
                systemctl is-enabled "${unit}" 2>/dev/null | grep -Eq '^masked(-runtime)?$'
              done
            }

            stop_legacy_writer_processes() {
              local process_directory process_id command_line working_directory cgroup
              for process_directory in /proc/[0-9]*; do
                process_id="${process_directory##*/}"
                [ "${process_id}" = "$$" ] && continue
                command_line="$(tr '\0' ' ' < "${process_directory}/cmdline" 2>/dev/null || true)"
                [ -z "${command_line}" ] && continue
                working_directory="$(readlink -f "${process_directory}/cwd" 2>/dev/null || true)"
                cgroup="$(tr '\n' ' ' < "${process_directory}/cgroup" 2>/dev/null || true)"
                if [[ "${working_directory}" == /var/www/prohelper* || "${command_line}" == *'/var/www/prohelper/'* || "${command_line}" == *'prohelper@'* || "${cgroup}" == *'most-'* || "${cgroup}" == *'prohelper'* ]]; then
                  if [[ "${command_line}" =~ (^|[[:space:]/])(php([0-9.]+)?|rr|roadrunner)([[:space:]]|$) ]] \
                    && [[ "${command_line}" =~ (artisan([[:space:]]|$)|queue:work|horizon|schedule:work|octane:start|reverb:start|rr[[:space:]]+serve|roadrunner) ]]; then
                    kill -TERM "${process_id}" 2>/dev/null || true
                  fi
                fi
              done
            }

            systemd_unit_exists() {
              local unit_fragment_path
              unit_fragment_path="$(systemctl show --property=FragmentPath --value "$1" 2>/dev/null || true)"
              [ -n "${unit_fragment_path}" ] && [ "${unit_fragment_path}" != 'n/a' ]
            }

            assert_legacy_runtime_stopped() {
              local process_directory process_id command_line working_directory cgroup unit unit_state supervisor_status running_services
              running_services="$(docker compose ps --status running -q ${BACKEND_STOP_SERVICES})"
              if [ -n "${running_services}" ]; then
                echo 'MOST backend compose writers remain active; refusing deployment'
                docker compose ps --status running ${BACKEND_STOP_SERVICES}
                return 1
              fi
              for unit in "${MOST_SYSTEMD_WRITER_UNITS[@]}"; do
                if ! systemd_unit_exists "${unit}"; then
                  continue
                fi
                unit_state="$(systemctl is-enabled "${unit}" 2>/dev/null || true)"
                if [[ ! "${unit_state}" =~ ^(masked(-runtime)?|disabled)$ ]]; then
                  echo "MOST backend writer unit is not runtime-masked (${unit}); refusing deployment"
                  return 1
                fi
                if systemctl is-active --quiet "${unit}"; then
                  echo "MOST backend writer unit remains active (${unit}); refusing deployment"
                  return 1
                fi
              done
              supervisor_status="$(supervisorctl status 2>/dev/null || true)"
              if awk -v pattern="${MOST_SUPERVISOR_WRITER_PROGRAM_PATTERN}" '$1 ~ pattern && ($2 == "RUNNING" || $2 == "STARTING" || $2 == "BACKOFF") { found = 1 } END { exit found ? 0 : 1 }' <<< "${supervisor_status}"; then
                echo 'MOST backend supervisor writer remains active; refusing deployment'
                return 1
              fi
              for process_directory in /proc/[0-9]*; do
                process_id="${process_directory##*/}"
                [ "${process_id}" = "$$" ] && continue
                command_line="$(tr '\0' ' ' < "${process_directory}/cmdline" 2>/dev/null || true)"
                [ -z "${command_line}" ] && continue
                working_directory="$(readlink -f "${process_directory}/cwd" 2>/dev/null || true)"
                cgroup="$(tr '\n' ' ' < "${process_directory}/cgroup" 2>/dev/null || true)"
                if [[ "${working_directory}" == /var/www/prohelper* || "${command_line}" == *'/var/www/prohelper/'* || "${command_line}" == *'prohelper@'* || "${cgroup}" == *'most-'* || "${cgroup}" == *'prohelper'* ]]; then
                  if [[ "${command_line}" =~ (^|[[:space:]/])(php([0-9.]+)?|rr|roadrunner)([[:space:]]|$) ]] \
                    && [[ "${command_line}" =~ (artisan([[:space:]]|$)|queue:work|horizon|schedule:work|octane:start|reverb:start|rr[[:space:]]+serve|roadrunner) ]]; then
                    echo "MOST backend writer process remains active (pid=${process_id}); refusing deployment"
                    return 1
                  fi
                fi
              done
            }

            deployment_failed() {
              local exit_code=$?
              trap - ERR
              set +e
              systemctl stop nginx
              docker compose stop --timeout 30 ${BACKEND_STOP_SERVICES}
              stop_legacy_supervisor_processes
              stop_legacy_systemd_processes
              stop_legacy_writer_processes
              exit "${exit_code}"
            }

            if [ -n "${YOOKASSA_SHOP_ID:-}" ] && [ -n "${YOOKASSA_SECRET_KEY:-}" ]; then
              upsert_env YOOKASSA_MODE yookassa_test
              upsert_env YOOKASSA_SHOP_ID "${YOOKASSA_SHOP_ID}"
              upsert_env YOOKASSA_SECRET_KEY "${YOOKASSA_SECRET_KEY}"
              upsert_env YOOKASSA_TEST_ORGANIZATION_IDS "${YOOKASSA_TEST_ORGANIZATION_IDS:-}"
              upsert_env YOOKASSA_RETURN_URL 'https://1мост.рф/dashboard/billing'
              upsert_env YOOKASSA_WEBHOOK_URL 'https://1мост.рф/api/v1/webhooks/yookassa'
              upsert_env YOOKASSA_RECEIPT_ENABLED false
              upsert_env YOOKASSA_LIVE_ENABLED false
              upsert_env YOOKASSA_LIVE_LEGAL_ENTITY_CONFIRMED false
              upsert_env YOOKASSA_LIVE_CONTRACT_CONFIRMED false
              upsert_env YOOKASSA_LIVE_RECEIPT_SETTINGS_CONFIRMED false
            else
              upsert_env YOOKASSA_MODE disabled
            fi

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "${IMAGE_REF}"
            prepare_public_core_deny_policy
            prepare_public_core_image_inputs "${IMAGE_REF}" "${RELEASE_SHA}" "${PREVIOUS_RELEASE_SHA}"

            upsert_env MOST_IMAGE_REF "${IMAGE_REF}"
            upsert_env MOST_RELEASE_SHA "${RELEASE_SHA}"
            upsert_env SENTRY_RELEASE "prohelper@${RELEASE_SHA}"
            upsert_env REVERB_APP_KEY "${REVERB_APP_KEY}"
            upsert_env LEGAL_ARCHIVE_SCANNER clamav
            remove_env_key LEGAL_ARCHIVE_AUDIT_PHASE_B_CUTOVER_ENABLED

            ensure_immutable_audit_writer_secret
            ensure_onlyoffice_jwt_secret_alignment
            if ! git diff --quiet "${PREVIOUS_RELEASE_SHA}" "${RELEASE_SHA}" -- deploy/onlyoffice .github/workflows/deploy-backend.yml; then
              apply_onlyoffice_callback_transport
            fi
            docker compose pull clamav
            docker compose up -d clamav
            for attempt in $(seq 1 72); do
              if docker compose exec -T clamav clamdscan --ping 1; then
                break
              fi
              if [ "${attempt}" -eq 72 ]; then
                echo 'ClamAV did not become ready; refusing deployment'
                exit 1
              fi
              sleep 5
            done
            MOST_IMAGE_REF="${IMAGE_REF}" docker compose run --rm --no-deps geometry-worker /usr/local/bin/geometry-runtime-smoke

            trap deployment_failed ERR
            systemctl stop nginx
            stop_legacy_supervisor_processes
            stop_legacy_systemd_processes
            stop_legacy_writer_processes
            docker compose stop --timeout 30 ${BACKEND_STOP_SERVICES}
            assert_legacy_runtime_stopped

            MOST_IMAGE_REF="${IMAGE_REF}" docker compose run --rm --no-deps api php artisan migrate:safe --force
            MOST_IMAGE_REF="${IMAGE_REF}" docker compose run --rm --no-deps api php artisan auth:diagnose --clear-cache
            assert_legacy_runtime_stopped
            MOST_IMAGE_REF="${IMAGE_REF}" docker compose run --rm --no-deps -e LEGAL_ARCHIVE_AUDIT_PHASE_B_CUTOVER_ENABLED=true api php artisan immutable-audit:confirm-drain
            assert_legacy_runtime_stopped
            MOST_IMAGE_REF="${IMAGE_REF}" docker compose run --rm --no-deps -e LEGAL_ARCHIVE_AUDIT_PHASE_B_CUTOVER_ENABLED=true api php artisan immutable-audit:phase-b-cutover --confirm-writer-version=2
            assert_legacy_runtime_stopped
            MOST_IMAGE_REF="${IMAGE_REF}" docker compose run --rm --no-deps -e LEGAL_ARCHIVE_AUDIT_PHASE_B_CUTOVER_ENABLED=true api php artisan immutable-audit:confirm-drain
            assert_legacy_runtime_stopped
            MOST_IMAGE_REF="${IMAGE_REF}" docker compose run --rm --no-deps -e LEGAL_ARCHIVE_AUDIT_REPAIR_ENABLED=true api php artisan immutable-audit:repair-invariants --confirm-repair
            MOST_IMAGE_REF="${IMAGE_REF}" docker compose run --rm --no-deps api php artisan immutable-audit:writer-readiness
            # All drain/migrations and broad checks are complete before the 30s park window.
            MOST_PUBLIC_CORE_STAGED_API=''
            stage_public_core_approved_runtime "${IMAGE_REF}" "${RELEASE_SHA}"
            RESUME_SERVICES="${BACKEND_SERVICES}"
            if [ -n "${MOST_PUBLIC_CORE_STAGED_API}" ]; then
              RESUME_SERVICES=''
              for service in "${MOST_COMPOSE_WRITER_SERVICES[@]}"; do
                [ "${service}" = api ] || RESUME_SERVICES="${RESUME_SERVICES} ${service}"
              done
              # Never --remove-orphans here: it could remove the parked-command overrides.
              MOST_IMAGE_REF="${IMAGE_REF}" docker compose up -d --no-deps --force-recreate ${RESUME_SERVICES}
              test "$(docker ps -q --no-trunc --filter label=com.docker.compose.project=prohelper --filter label=com.docker.compose.service=api)" = "${MOST_PUBLIC_CORE_STAGED_API}"
            else
              MOST_IMAGE_REF="${IMAGE_REF}" docker compose up -d --force-recreate --remove-orphans ${BACKEND_SERVICES}
            fi
            ensure_onlyoffice_api_runtime_jwt_secret_alignment
            if grep -q '^ESTIMATE_COMPLETENESS_ARBITER_ENABLED=true$' .env; then
              docker compose exec -T api php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); exit(config("estimate-generation.completeness_arbiter.enabled") === true ? 0 : 1);'
              docker compose exec -T horizon php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); exit(config("estimate-generation.completeness_arbiter.enabled") === true ? 0 : 1);'
            fi

            for attempt in $(seq 1 24); do
              if docker compose exec -T api curl -fsS http://localhost:8000/ready >/dev/null \
                && docker compose exec -T api curl -fsS http://localhost:8000/up >/dev/null \
                && docker compose exec -T websockets php -r 'exit(@fsockopen("127.0.0.1", 8080) ? 0 : 1);' \
                && docker compose exec -T clamav clamdscan --ping 1 \
                && docker compose exec -T geometry-worker /usr/local/bin/geometry-runtime-smoke; then
                docker compose exec -T api php artisan assets:backfill --format=json
                docker compose exec -T api php artisan assets:reconcile --format=json || true
                docker compose exec -T api php artisan assets:verify-cutover --format=json --details || true
                docker compose exec -T scheduler tail -n 24 storage/logs/asset-registry-cutover.log || true
                systemctl start nginx
                systemctl is-active --quiet nginx
                trap - ERR
                echo "Backend deployment successful: ${IMAGE_REF}"
                exit 0
              fi
              sleep 5
            done

            docker compose logs --tail=200 api
            docker compose logs --tail=200 websockets
            docker compose logs --tail=200 horizon
            docker compose logs --tail=200 geometry-worker
            exit 1

  model_input:
    needs: release_mode
    if: needs.release_mode.outputs.input_allowed == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'input-only'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    concurrency:
      group: prod-backend-deploy
      cancel-in-progress: false
    steps:
      - name: Validate literal main input-only before managed credentials
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          INPUT_IMAGE_REF: ${{ inputs.input_image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$REQUESTED_MODE" = input-only
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SOURCE_SHA" = "$GITHUB_SHA"
          [[ "$INPUT_IMAGE_REF" =~ ^ghcr\.io/kamilgaraev/proexpert/prohelper@sha256:[0-9a-f]{64}$ ]]
      - name: Checkout exact input source without persisted credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pin existing input helper source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'allowlist=%s\n' "$(sha256sum deploy/backend-runtime-allowlist.sh | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          printf 'runtime=%s\n' "$(sha256sum docker/public-core/runtime.php | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Describe staged model input through existing managed custodian
        uses: appleboy/ssh-action@v1.0.3
        env:
          INPUT_SHA: ${{ github.sha }}
          INPUT_IMAGE_REF: ${{ inputs.input_image_ref }}
          INPUT_ALLOWLIST_SHA: ${{ steps.source.outputs.allowlist }}
          INPUT_RUNTIME_SHA: ${{ steps.source.outputs.runtime }}
        with:
          host: 89.169.44.117
          username: root
          key: ${{ secrets.DEPLOY }}
          envs: INPUT_SHA,INPUT_IMAGE_REF,INPUT_ALLOWLIST_SHA,INPUT_RUNTIME_SHA
          command_timeout: 120s
          script_stop: true
          script: |
            set -euo pipefail
            [[ "${INPUT_SHA}" =~ ^[0-9a-f]{40}$ ]]
            [[ "${INPUT_ALLOWLIST_SHA}" =~ ^[0-9a-f]{64}$ ]]
            [[ "${INPUT_RUNTIME_SHA}" =~ ^[0-9a-f]{64}$ ]]
            [[ "${INPUT_IMAGE_REF}" =~ ^ghcr\.io/kamilgaraev/proexpert/prohelper@sha256:[0-9a-f]{64}$ ]]
            cd /var/www/prohelper
            test "$(git rev-parse HEAD)" = "${INPUT_SHA}"
            git diff --quiet -- deploy/backend-runtime-allowlist.sh docker/public-core/runtime.php
            test "$(sha256sum deploy/backend-runtime-allowlist.sh | cut -d' ' -f1)" = "${INPUT_ALLOWLIST_SHA}"
            source deploy/backend-runtime-allowlist.sh
            describe_managed_model_input "${INPUT_IMAGE_REF}" "${INPUT_SHA}" "${INPUT_RUNTIME_SHA}"

  qualification:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'qualification-only' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    concurrency:
      group: backend-qualification-${{ github.run_id }}-${{ github.run_attempt }}
      cancel-in-progress: false
    env:
      QUALIFICATION_IMAGE: most-backend-qualification:${{ github.sha }}
    steps:
      - name: Initialize own runner temporary directory
        shell: bash
        run: |
          set -euo pipefail
          printf 'QUALIFICATION_DIR=%s/most-qualification-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Checkout exact qualification source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          set-safe-directory: false

      - name: Validate source and create tracked build context
        id: source
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          REQUESTED_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$QUALIFICATION_DIR/evidence" "$QUALIFICATION_DIR/context"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, tarfile
          root = pathlib.Path(os.environ['QUALIFICATION_DIR'])
          evidence = root / 'evidence'
          receipt = {'qualification': 'NEEDS_EVIDENCE', 'status': 'rejected'}
          try:
              sha = os.environ['GITHUB_SHA']
              expected = os.environ['EXPECTED_SOURCE_SHA']
              if os.environ['GITHUB_EVENT_NAME'] != 'workflow_dispatch' or os.environ['REQUESTED_MODE'] != 'qualification-only' or not os.environ['GITHUB_REF'].startswith('refs/heads/'):
                  raise ValueError('qualification_mode_required')
              if re.fullmatch(r'[0-9a-f]{40}', expected) is None or expected != sha:
                  raise ValueError('expected_source_sha_mismatch')
              if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != sha:
                  raise ValueError('checkout_sha_mismatch')
              if subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=all'], text=True).strip():
                  raise ValueError('unclean_context')
              archive = root / 'source.tar'
              subprocess.run(['git', 'archive', '--format=tar', '--output', str(archive), sha], check=True)
              context = root / 'context'
              with tarfile.open(archive) as tar:
                  for member in tar.getmembers():
                      path = pathlib.PurePosixPath(member.name)
                      name = path.name
                      if path.is_absolute() or '..' in path.parts or not (member.isfile() or member.isdir() or member.issym()):
                          raise ValueError('unsafe_archive_member')
                      if (name == '.env' or (name.startswith('.env.') and name != '.env.example') or name in ['.npmrc', '.netrc', 'auth.json', 'id_rsa', 'id_ed25519'] or path.suffix.lower() in ['.pem', '.key', '.p12', '.pfx']):
                          raise ValueError('credential_path_in_context')
                      if member.issym() and not (context / path.parent / member.linkname).resolve().is_relative_to(context.resolve()):
                          raise ValueError('external_context_symlink')
              subprocess.run(['tar', '-xf', str(archive), '-C', str(context)], check=True)
              patterns = (context / '.dockerignore').read_text().splitlines()
              if not set(['/.git', '/.env', '/.env.*', '/vendor', '/node_modules', '/storage/*.key']).issubset(patterns):
                  raise ValueError('dockerignore_boundary_missing')
              digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
              receipt.update(status='accepted_source_only', sourceSha=sha, sourceArchiveSha256=digest(archive), dockerfileSha256=digest(context / 'Dockerfile.prod'), dockerignoreSha256=digest(context / '.dockerignore'), context='tracked exact SHA archive, no checkout credentials/untracked files')
          except Exception:
              receipt['reason'] = 'source_or_context_validation_failed'
              raise
          finally:
              (evidence / 'source.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY

      - name: Build exact qualification image without registry push
        id: build
        timeout-minutes: 30
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: 'false'
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          builder: default
          context: ${{ env.QUALIFICATION_DIR }}/context
          file: ${{ env.QUALIFICATION_DIR }}/context/Dockerfile.prod
          push: false
          load: true
          provenance: false
          sbom: false
          github-token: ''
          build-args: MOST_RELEASE_SHA=${{ github.sha }}
          tags: ${{ env.QUALIFICATION_IMAGE }}

      - name: Record build outcome without private metadata
        if: always() && steps.source.conclusion == 'success'
        env:
          BUILD_CONCLUSION: ${{ steps.build.conclusion }}
          BUILD_IMAGE_ID: ${{ steps.build.outputs.imageid }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re
          digest = lambda value: value if re.fullmatch(r'sha256:[0-9a-f]{64}', value) else None
          receipt = {'sourceSha': os.environ['GITHUB_SHA'], 'buildConclusion': os.environ['BUILD_CONCLUSION'], 'imageId': digest(os.environ['BUILD_IMAGE_ID']), 'buildDigest': digest(os.environ['BUILD_DIGEST']), 'registryPush': False, 'actualRuntimeVerified': False}
          pathlib.Path(os.environ['QUALIFICATION_DIR'], 'evidence', 'build.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY

      - name: Verify immutable image ID and embedded source SHA
        id: mapping
        if: success() && steps.build.conclusion == 'success'
        timeout-minutes: 1
        env:
          BUILD_IMAGE_ID: ${{ steps.build.outputs.imageid }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          observed_id="$(docker image inspect --format '{{.Id}}' "$QUALIFICATION_IMAGE")"
          revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$BUILD_IMAGE_ID")"
          image_platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$BUILD_IMAGE_ID")"
          test "$observed_id" = "$BUILD_IMAGE_ID"
          test "$revision" = "$GITHUB_SHA"
          test "$image_platform" = linux/amd64
          embedded_sha="$(timeout --signal=TERM --kill-after=5s 20s docker run --rm \
            --name "most-qualification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-mapping" \
            --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --user 82:82 \
            --entrypoint php "$BUILD_IMAGE_ID" -r 'echo json_decode(file_get_contents("/etc/most/release.json"), true, 8, JSON_THROW_ON_ERROR)["sha"];')"
          test "$embedded_sha" = "$GITHUB_SHA"
          printf '{"sourceSha":"%s","imageId":"%s","embeddedReleaseSha":"%s","imagePlatform":"%s","sourceImageVerified":true,"actualRuntimeVerified":false}\n' "$GITHUB_SHA" "$BUILD_IMAGE_ID" "$embedded_sha" "$image_platform" > "$QUALIFICATION_DIR/evidence/mapping.json"

      - name: Inspect bounded native capability and unavailable guards
        id: native
        if: success() && steps.mapping.conclusion == 'success'
        timeout-minutes: 2
        env:
          BUILD_IMAGE_ID: ${{ steps.build.outputs.imageid }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          cat > "$QUALIFICATION_DIR/native.php" <<'PHP'
          <?php
          declare(strict_types=1);
          require '/var/www/html/vendor/autoload.php';
          require '/var/www/html/docker/public-core/runtime.php';
          use Most\PublicCore\ProcessIdentity;
          use Most\PublicCore\ParkedRoleBootstrap;
          use Most\PublicCore\GatewayRuntimeBootstrap;
          $role = getenv('PROBE_ROLE');
          $expectedUid = ['app' => 82, 'processor' => 41002, 'gateway' => 41003][$role];
          $result = ['qualification' => 'native_fixture_only', 'actualRuntimeVerified' => false, 'actualModelVerified' => false, 'role' => $role, 'php' => PHP_VERSION];
          try {
              foreach (['sockets', 'pcntl', 'posix'] as $extension) {
                  $result[$extension] = extension_loaded($extension);
                  if (!$result[$extension]) { throw new LogicException('capability_missing'); }
              }
              $result['SO_PASSCRED'] = defined('SO_PASSCRED');
              $result['SCM_CREDENTIALS'] = defined('SCM_CREDENTIALS');
              $result['nativeChannelAvailable'] = App\Services\Privacy\PublicCore\Transport\AuthenticatedPublicCoreChannel::isNativeAvailable();
              if (!$result['nativeChannelAvailable']) { throw new LogicException('capability_missing'); }
              $peer = ['pid' => getmypid(), 'uid' => posix_geteuid(), 'gid' => posix_getegid()];
              $result['peer'] = $peer;
              if ($peer['uid'] !== $expectedUid || $peer['gid'] !== $expectedUid) { throw new LogicException('identity_mismatch'); }
              $result['embeddedReleaseSha'] = json_decode(file_get_contents('/etc/most/release.json'), true, 8, JSON_THROW_ON_ERROR)['sha'];
              if ($result['embeddedReleaseSha'] !== getenv('EXPECTED_SOURCE_SHA')) { throw new LogicException('source_mismatch'); }
              $lifetime = ProcessIdentity::lifetime($peer);
              $result['lifetimeStable'] = hash_equals($lifetime, ProcessIdentity::lifetime($peer));
              $result['wrongUidDenied'] = false;
              try { ProcessIdentity::lifetime(array_replace($peer, ['uid' => 0])); } catch (LogicException) { $result['wrongUidDenied'] = true; }
              $pair = [];
              if (!socket_create_pair(AF_UNIX, SOCK_DGRAM, 0, $pair) || !socket_set_option($pair[0], SOL_SOCKET, SO_PASSCRED, 1) || !socket_set_option($pair[0], SOL_SOCKET, SO_RCVTIMEO, ['sec' => 2, 'usec' => 0])) { throw new LogicException('socket_unavailable'); }
              $child = pcntl_fork();
              if ($child === -1) { throw new LogicException('fork_unavailable'); }
              if ($child === 0) { socket_close($pair[0]); exit(socket_sendmsg($pair[1], ['iov' => ['x']], 0) === 1 ? 0 : 1); }
              socket_close($pair[1]);
              $message = ['buffer_size' => 1, 'controllen' => socket_cmsg_space(SOL_SOCKET, SCM_CREDENTIALS)];
              $received = socket_recvmsg($pair[0], $message, 0);
              socket_close($pair[0]);
              pcntl_waitpid($child, $status);
              $control = $message['control'][0] ?? [];
              $result['kernelCredentialMatch'] = $received === 1 && count($message['control'] ?? []) === 1 && ($control['level'] ?? null) === SOL_SOCKET && ($control['type'] ?? null) === SCM_CREDENTIALS && ($control['data'] ?? null) === ['pid' => $child, 'uid' => $expectedUid, 'gid' => $expectedUid] && pcntl_wifexited($status) && pcntl_wexitstatus($status) === 0;
              if ($role === 'app') {
                  $result['inactiveBootstrap'] = (require '/etc/most/public-core/app/bootstrap.php') === null;
              } else {
                  if ($role === 'gateway') {
                      $result['inactiveManifest'] = GatewayRuntimeBootstrap::configurationState(GatewayRuntimeBootstrap::DEFAULT_CONFIGURATION) === 'inactive';
                  } else {
                      $result['inactiveBootstrap'] = (require '/etc/most/public-core/processor/bootstrap.php') === null;
                  }
                  $start = hrtime(true);
                  $result['parkedUnavailable'] = false;
                  try { ParkedRoleBootstrap::wait($role, 100); } catch (LogicException $error) { $result['parkedUnavailable'] = $error->getMessage() === 'runtime_not_activated'; }
                  $result['parkedMilliseconds'] = (hrtime(true) - $start) / 1000000;
                  $result['samePid'] = getmypid() === $peer['pid'];
                  if (!$result['parkedUnavailable'] || !$result['samePid'] || $result['parkedMilliseconds'] < 100 || $result['parkedMilliseconds'] > 2000) { throw new LogicException('parked_guard_failed'); }
              }
              if (!$result['lifetimeStable'] || !$result['wrongUidDenied'] || !$result['kernelCredentialMatch'] || !($result['inactiveBootstrap'] ?? $result['inactiveManifest'] ?? false)) { throw new LogicException('native_guard_failed'); }
              $result['status'] = 'passed_fixture_only';
          } catch (Throwable) { $result['status'] = 'failed'; }
          echo json_encode($result, JSON_THROW_ON_ERROR | JSON_PRETTY_PRINT)."\n";
          exit($result['status'] === 'passed_fixture_only' ? 0 : 1);
          PHP
          chmod 0644 "$QUALIFICATION_DIR/native.php"
          native_exit=0
          for role in app processor gateway; do
            case "$role" in app) uid=82 ;; processor) uid=41002 ;; gateway) uid=41003 ;; esac
            probe_exit=0
            timeout --signal=TERM --kill-after=5s 20s docker run --rm \
              --name "most-qualification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${role}" \
              --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 32 \
              --user "${uid}:${uid}" --mount "type=bind,source=${QUALIFICATION_DIR}/native.php,target=/probe.php,readonly" \
              --env "EXPECTED_SOURCE_SHA=${GITHUB_SHA}" --env "PROBE_ROLE=${role}" \
              --entrypoint php "$BUILD_IMAGE_ID" /probe.php > "$QUALIFICATION_DIR/evidence/${role}.json" || probe_exit=$?
            printf '{"exit":%s}\n' "$probe_exit" > "$QUALIFICATION_DIR/evidence/${role}-exit.json"
            test "$probe_exit" -eq 0 || native_exit=1
          done
          exit "$native_exit"

      - name: Save exact image within repository qualification artifact
        if: always() && steps.mapping.conclusion == 'success'
        timeout-minutes: 5
        env:
          BUILD_IMAGE_ID: ${{ steps.build.outputs.imageid }}
          NATIVE_CONCLUSION: ${{ steps.native.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          docker image save "$BUILD_IMAGE_ID" | gzip -1 > "$QUALIFICATION_DIR/image.tar.gz.partial"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['QUALIFICATION_DIR'], 'evidence')
          digest = hashlib.sha256()
          archive = pathlib.Path(os.environ['QUALIFICATION_DIR'], 'image.tar.gz.partial')
          with archive.open('rb') as stream:
              for block in iter(lambda: stream.read(1048576), b''): digest.update(block)
          archive.replace(root / 'image.tar.gz')
          (root / 'image.json').write_text(json.dumps({'sourceSha': os.environ['GITHUB_SHA'], 'imageId': os.environ['BUILD_IMAGE_ID'], 'imageArchiveSha256': digest.hexdigest(), 'registryDigest': None, 'qualification': 'source_image_only', 'nativeConclusion': os.environ['NATIVE_CONCLUSION'], 'actualRuntimeVerified': False}, indent=2) + '\n')
          PY

      - name: Remove only own disposable probes
        if: always()
        shell: bash
        run: |
          for role in mapping app processor gateway; do
            name="most-qualification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${role}"
            if docker container inspect "$name" >/dev/null 2>&1; then docker rm --force "$name" >/dev/null; fi
          done

      - name: Upload bounded qualification evidence and image
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.QUALIFICATION_DIR }}/evidence/*.json
            ${{ env.QUALIFICATION_DIR }}/evidence/image.tar.gz
          if-no-files-found: ignore
          include-hidden-files: false
          compression-level: 0
          retention-days: 3
