services:
  postgres-testing:
    image: pgvector/pgvector:0.8.5-pg16-bookworm
    command: ["postgres", "-c", "max_locks_per_transaction=1024"]
    environment:
      POSTGRES_DB: most_backend_testing
      POSTGRES_USER: most_testing
      POSTGRES_PASSWORD: most_testing_password
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U most_testing -d most_backend_testing"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres_testing_data:/var/lib/postgresql/data
      - ./docker/postgres-testing/init.sql:/docker-entrypoint-initdb.d/10-enable-vector.sql:ro

volumes:
  postgres_testing_data:
