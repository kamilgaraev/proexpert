/payments/documents/{id}/payments:
  post:
    tags: [Payments]
    summary: Зафиксировать факт оплаты
    description: Регистрирует платёж в МОСТ; не выполняет банковский перевод. Повтор защищён заголовком Idempotency-Key.
    operationId: mobile_post_payments_documents_id_payments
    security:
      - bearerAuth: []
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
      - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [amount]
            properties:
              amount: { type: number, exclusiveMinimum: 0 }
              payment_method: { type: string }
              transaction_date: { type: string, format: date }
              payment_date: { type: string, format: date }
              reference_number: { type: string }
              notes: { type: string }
              budget_override_reason: { type: string }
    responses:
      '200': { description: "Обновлённый документ после регистрации оплаты", content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/MobileEnvelope' } } } }
      '401': { $ref: '../openapi.yaml#/components/responses/MobileUnauthorized' }
      '403': { $ref: '../openapi.yaml#/components/responses/MobileForbidden' }
      '404': { description: Документ недоступен в текущей организации }
      '422': { $ref: '../openapi.yaml#/components/responses/MobileValidationError' }

