# Generated from `php artisan route:list --path=api/v1/mobile --json`.
# Keep synchronized with MobileApiContractDocumentationTest.

/acts:
  get:
    tags: [Acts]
    summary: Список актов организации
    operationId: mobile_get_acts
    security:
      - bearerAuth: []
    parameters:
      - { in: query, name: project_id, schema: { type: integer } }
      - { in: query, name: status, schema: { type: string } }
      - { in: query, name: search, schema: { type: string } }
      - { in: query, name: page, schema: { type: integer, minimum: 1 } }
      - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 50 } }
    responses:
      '200': { description: "Список и meta с пагинацией и capabilities", content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/MobileEnvelope' } } } }
      '401': { $ref: '../openapi.yaml#/components/responses/MobileUnauthorized' }
      '403': { $ref: '../openapi.yaml#/components/responses/MobileForbidden' }
/acts/{act}:
  get:
    tags: [Acts]
    summary: Карточка акта и доступные действия
    operationId: mobile_get_acts_act
    security:
      - bearerAuth: []
    parameters:
      - { in: path, name: act, required: true, schema: { type: integer } }
    responses:
      '200': { description: "Карточка акта; capabilities.can_field_confirm управляет полевой фиксацией", content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/MobileEnvelope' } } } }
      '401': { $ref: '../openapi.yaml#/components/responses/MobileUnauthorized' }
      '403': { $ref: '../openapi.yaml#/components/responses/MobileForbidden' }
      '404': { description: Акт или файл недоступен в текущей организации }
/acts/{act}/files/{file}:
  get:
    tags: [Acts]
    summary: Скачать файл акта
    operationId: mobile_get_acts_act_files_file
    security:
      - bearerAuth: []
    parameters:
      - { in: path, name: act, required: true, schema: { type: integer } }
      - { in: path, name: file, required: true, schema: { type: integer } }
    responses:
      '200': { description: Защищённое содержимое файла }
      '401': { $ref: '../openapi.yaml#/components/responses/MobileUnauthorized' }
      '403': { $ref: '../openapi.yaml#/components/responses/MobileForbidden' }
      '404': { description: Акт или файл недоступен в текущей организации }
/acts/{act}/field-confirmations:
  post:
    tags: [Acts]
    summary: Зафиксировать полевую приёмку подписью на экране
    description: Создаёт отдельное неизменяемое свидетельство приёмки и не меняет юридическую подпись или статус акта. Повтор с тем же Idempotency-Key возвращает прежнюю фиксацию.
    operationId: mobile_post_acts_act_field_confirmations
    security:
      - bearerAuth: []
    parameters:
      - { in: path, name: act, required: true, schema: { type: integer } }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [signature_data, idempotency_key]
            properties:
              signature_data: { type: string, description: PNG подпись в data URL или base64 }
              idempotency_key: { type: string, minLength: 16, maxLength: 128 }
    responses:
      '201': { description: "Полевое подтверждение создано", content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/MobileEnvelope' } } } }
      '200': { description: Возвращена ранее созданная фиксация при повторе того же запроса }
      '401': { $ref: '../openapi.yaml#/components/responses/MobileUnauthorized' }
      '403': { $ref: '../openapi.yaml#/components/responses/MobileForbidden' }
      '409': { description: Акт уже подтверждён этим пользователем либо ключ использован с другим содержимым }
      '422': { $ref: '../openapi.yaml#/components/responses/MobileValidationError' }
/payments/documents:
  get:
    tags: [Payments]
    summary: Список финансовых документов
    operationId: mobile_get_payments_documents
    security:
      - bearerAuth: []
    parameters:
      - { in: query, name: project_id, schema: { type: integer } }
      - { in: query, name: status, schema: { type: string } }
      - { in: query, name: search, schema: { type: string } }
      - { in: query, name: page, schema: { type: integer, minimum: 1 } }
      - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 50 } }
    responses:
      '200': { description: "Список и meta с пагинацией и capabilities.can_create", content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/MobileEnvelope' } } } }
      '401': { $ref: '../openapi.yaml#/components/responses/MobileUnauthorized' }
      '403': { $ref: '../openapi.yaml#/components/responses/MobileForbidden' }
  post:
    tags: [Payments]
    summary: Создать финансовый документ
    operationId: mobile_post_payments_documents
    security:
      - bearerAuth: []
    parameters:
      - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/GenericObject' }
          example: { document_type: payment_request, project_id: 42, amount: 125000, currency: RUB, payment_purpose: Материалы }
    responses:
      '201': { description: "Документ создан; повтор ключа идемпотентен", content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/MobileEnvelope' } } } }
      '200': { description: Повтор того же ключа и тела запроса вернул прежний документ }
      '401': { $ref: '../openapi.yaml#/components/responses/MobileUnauthorized' }
      '403': { $ref: '../openapi.yaml#/components/responses/MobileForbidden' }
      '409': { description: Ключ уже использован с другим содержимым }
      '422': { $ref: '../openapi.yaml#/components/responses/MobileValidationError' }
