type: object
description: Пагинированная коллекция видов работ.
properties:
  summary:
    type: object
    description: Сводка по всем видам работ текущей организации, соответствующим фильтрам name, category и is_active, до разбиения на страницы. Поле добавлено без изменения data и meta.
    required: [total, active, categories]
    properties:
      total:
        type: integer
        minimum: 0
        description: Количество видов работ во всём выбранном отборе.
        example: 35
      active:
        type: integer
        minimum: 0
        description: Количество активных видов работ в выбранном отборе.
        example: 30
      categories:
        type: integer
        minimum: 0
        description: Количество различных непустых категорий в выбранном отборе; null и пустая строка не учитываются.
        example: 4
  data:
    type: array
    items:
      $ref: './WorkType.yaml'
    description: Массив видов работ
  links:
    type: object
    description: Ссылки для навигации по страницам
    properties:
      first:
        type: string
        nullable: true
        description: Ссылка на первую страницу
        example: "http://example.com/api/v1/admin/work-types?page=1"
      last:
        type: string
        nullable: true
        description: Ссылка на последнюю страницу
        example: "http://example.com/api/v1/admin/work-types?page=8"
      prev:
        type: string
        nullable: true
        description: Ссылка на предыдущую страницу
        example: "http://example.com/api/v1/admin/work-types?page=2"
      next:
        type: string
        nullable: true
        description: Ссылка на следующую страницу
        example: "http://example.com/api/v1/admin/work-types?page=4"
  meta:
    type: object
    description: Метаданные пагинации
    properties:
      current_page:
        type: integer
        description: Текущая страница
        example: 3
      from:
        type: integer
        nullable: true
        description: Номер первого элемента на странице
        example: 31
      last_page:
        type: integer
        description: Номер последней страницы
        example: 8
      path:
        type: string
        description: Базовый путь для пагинации
        example: "http://example.com/api/v1/admin/work-types"
      per_page:
        type: integer
        description: Количество элементов на странице
        example: 15
      to:
        type: integer
        nullable: true
        description: Номер последнего элемента на странице
        example: 45
      total:
        type: integer
        description: Общее количество элементов
        example: 112
