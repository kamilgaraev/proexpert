x-json-logging: &json-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-reverb-client-environment: &reverb-client-environment
  REVERB_INTERNAL_HOST: websockets
  REVERB_INTERNAL_PORT: 8080
  REVERB_INTERNAL_SCHEME: http

x-public-app-environment: &public-app-environment
  <<: *reverb-client-environment
  # Public App/queue roles never receive provider credentials or fallback keys.
  OPENAI_API_KEY: ""
  DEEPSEEK_API_KEY: ""
  TIMEWEB_AI_API_KEY: ""
  TIMEWEB_API_KEY: ""
  TIMEWEB_AI_PROXY_KEY: ""
  AI_RAG_EMBEDDING_API_KEY: ""

services:
  # --- BACKEND SERVICES ---
  api:
    image: ${MOST_IMAGE_REF:-ghcr.io/kamilgaraev/proexpert/prohelper:${MOST_IMAGE_TAG:-latest}}
    container_name: prohelper-api
    restart: unless-stopped
    group_add: ["41002"]
    command: "php -d memory_limit=2G -d post_max_size=640M -d upload_max_filesize=500M -d max_file_uploads=100 artisan octane:start --server=roadrunner --host=0.0.0.0 --port=8000 --workers=4 --max-requests=1000 --rr-config=/var/www/html/.rr.yaml"
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment: *public-app-environment
    volumes:
      - ./storage/logs:/var/www/html/storage/logs
      - type: bind
        source: /etc/most/public-core/app
        target: /etc/most/public-core/app
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/most-public-core/app
        target: /run/most-public-core/app
        bind:
          create_host_path: false
      - type: bind
        source: /run/most-public-core/processor
        target: /run/most-public-core/processor
        bind:
          create_host_path: false
    networks:
      - prohelper-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ready || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
    logging: *json-logging

  websockets:
    image: ${MOST_IMAGE_REF:-ghcr.io/kamilgaraev/proexpert/prohelper:${MOST_IMAGE_TAG:-latest}}
    container_name: prohelper-websockets
    restart: unless-stopped
    command: "php artisan reverb:start --host=0.0.0.0 --port=8080"
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment: *public-app-environment
    volumes:
      - ./storage/logs:/var/www/html/storage/logs
    networks:
      - prohelper-network
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 8080) ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *json-logging

  horizon:
    image: ${MOST_IMAGE_REF:-ghcr.io/kamilgaraev/proexpert/prohelper:${MOST_IMAGE_TAG:-latest}}
    container_name: prohelper-horizon
    restart: unless-stopped
    group_add: ["41002"]
    pid: "service:api"
    depends_on:
      api:
        condition: service_started
    command: "php artisan horizon"
    env_file: .env
    environment: *public-app-environment
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./storage/logs:/var/www/html/storage/logs
      - type: bind
        source: /etc/most/public-core/app
        target: /etc/most/public-core/app
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/most-public-core/app
        target: /run/most-public-core/app
        bind:
          create_host_path: false
      - type: bind
        source: /run/most-public-core/processor
        target: /run/most-public-core/processor
        bind:
          create_host_path: false
    networks:
      - prohelper-network
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q 'Horizon is running' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *json-logging

  geometry-worker:
    image: ${MOST_IMAGE_REF:-ghcr.io/kamilgaraev/proexpert/prohelper:${MOST_IMAGE_TAG:-latest}}
    container_name: prohelper-geometry-worker
    restart: unless-stopped
    init: true
    command: "php artisan queue:work redis_estimate_generation --queue=estimate-generation-documents --sleep=1 --tries=3 --timeout=1800 --memory=512 --max-time=3600"
    env_file: .env
    environment: *public-app-environment
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1073741824,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 1280m
    cpus: 1.5
    stop_grace_period: 30s
    volumes:
      - ./storage/logs:/var/www/html/storage/logs
    networks:
      - prohelper-network
    logging: *json-logging

  geometry-recovery-worker:
    image: ${MOST_IMAGE_REF:-ghcr.io/kamilgaraev/proexpert/prohelper:${MOST_IMAGE_TAG:-latest}}
    container_name: prohelper-geometry-recovery-worker
    restart: unless-stopped
    init: true
    command: "php artisan queue:work redis_estimate_generation --queue=estimate-generation-documents-recovery --sleep=1 --tries=3 --timeout=1800 --memory=512 --max-time=3600"
    env_file: .env
    environment: *public-app-environment
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1073741824,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 1280m
    cpus: 1.0
    stop_grace_period: 30s
    volumes:
      - ./storage/logs:/var/www/html/storage/logs
    networks:
      - prohelper-network
    logging: *json-logging

  worker-heavy:
    image: ${MOST_IMAGE_REF:-ghcr.io/kamilgaraev/proexpert/prohelper:${MOST_IMAGE_TAG:-latest}}
    container_name: prohelper-worker-heavy
    restart: unless-stopped
    command: "php artisan queue:work redis --queue=heavy-imports --memory=2048 --timeout=3600"
    env_file: .env
    environment: *public-app-environment
    volumes:
      - ./storage/logs:/var/www/html/storage/logs
    networks:
      - prohelper-network
    logging: *json-logging
    deploy:
      resources:
        limits:
          memory: 2.5G

  worker-ifc:
    image: ${MOST_IMAGE_REF:-ghcr.io/kamilgaraev/proexpert/prohelper:${MOST_IMAGE_TAG:-latest}}
    container_name: prohelper-worker-ifc
    restart: unless-stopped
    command: "php -d memory_limit=3072M artisan queue:work redis_ifc --queue=ifc-processing --memory=3072 --timeout=6900 --tries=1"
    env_file: .env
    environment: *public-app-environment
    volumes:
      - ./storage/logs:/var/www/html/storage/logs
    networks:
      - prohelper-network
    logging: *json-logging
    deploy:
      resources:
        limits:
          memory: 3.5G

  scheduler:
    image: ${MOST_IMAGE_REF:-ghcr.io/kamilgaraev/proexpert/prohelper:${MOST_IMAGE_TAG:-latest}}
    container_name: prohelper-scheduler
    restart: unless-stopped
    init: true
    command: "php artisan schedule:work"
    env_file: .env
    environment: *public-app-environment
    volumes:
      - ./storage/logs:/var/www/html/storage/logs
    networks:
      - prohelper-network
    logging: *json-logging

  # Profiles keep protected roles inactive in the ordinary main deployment.
  # Private startup readers and Gateway egress qualification are still required.
  public-core-processor:
    image: ${MOST_IMAGE_REF:-ghcr.io/kamilgaraev/proexpert/prohelper:${MOST_IMAGE_TAG:-latest}}
    profiles: [public-core]
    user: "41002:41002"
    group_add: ["41003"]
    pid: "service:api"
    depends_on:
      api:
        condition: service_started
    command: [php, docker/public-core/runtime.php, processor]
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 512m
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16777216,mode=1777"]
    volumes:
      - type: bind
        source: /etc/most/public-core/processor
        target: /etc/most/public-core/processor
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/most-public-core/processor
        target: /run/most-public-core/processor
        bind:
          create_host_path: false
      - type: bind
        source: /run/most-public-core/gateway
        target: /run/most-public-core/gateway
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/most/public-core/processor
        target: /var/lib/most/public-core/processor
        bind:
          create_host_path: false
    logging: *json-logging

  public-core-gateway:
    image: ${MOST_IMAGE_REF:-ghcr.io/kamilgaraev/proexpert/prohelper:${MOST_IMAGE_TAG:-latest}}
    profiles: [public-core]
    user: "41003:41003"
    pid: "service:api"
    depends_on:
      api:
        condition: service_started
    command: [php, docker/public-core/runtime.php, gateway]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 512m
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16777216,mode=1777"]
    networks: [public-core-gateway]
    # Docker embedded DNS is not a permitted provider fallback.
    dns: [127.0.0.1]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
    volumes:
      - type: bind
        source: /etc/most/public-core/gateway
        target: /etc/most/public-core/gateway
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/most-public-core/gateway
        target: /run/most-public-core/gateway
        bind:
          create_host_path: false
    logging: *json-logging

  clamav:
    image: clamav/clamav:1.4.3
    container_name: prohelper-clamav
    restart: unless-stopped
    environment:
      CLAMD_STARTUP_TIMEOUT: 300
      FRESHCLAM_CHECKS: 12
    volumes:
      - clamav-data:/var/lib/clamav
      - ./docker/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    networks:
      - prohelper-network
    healthcheck:
      test: ["CMD-SHELL", "test -S /tmp/clamd.sock && clamdscan --ping 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 5m
    logging: *json-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    restart: unless-stopped
    networks:
      - prohelper-network
    logging: *json-logging

  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: node-exporter
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
    restart: unless-stopped
    networks:
      - prohelper-network
    logging: *json-logging

  # Автоматический перезапуск упавших контейнеров
  watchdog:
    image: willfarrell/autoheal
    container_name: monitoring-watchdog
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=5
      - AUTOHEAL_START_PERIOD=0
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
    restart: unless-stopped
    networks:
      - prohelper-network
    logging: *json-logging

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres-exporter
    ports:
      - "127.0.0.1:9187:9187"
    environment:
      - DATA_SOURCE_NAME=${POSTGRES_EXPORTER_DSN}
      - PG_EXPORTER_COLLECTION_TIMEOUT=5s
    command:
      - --no-collector.database
      - --no-collector.wal
    networks:
      - prohelper-network
    restart: unless-stopped
    logging: *json-logging

  docker-cleanup:
    image: docker:27.5-cli
    container_name: docker-cleanup
    restart: unless-stopped
    network_mode: none
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOCKER_IMAGE_PRUNE_UNTIL: 48h
      DOCKER_BUILDER_PRUNE_UNTIL: 48h
      DOCKER_CLEANUP_INTERVAL_SECONDS: 86400
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          date
          docker image prune -a -f --filter "until=$${DOCKER_IMAGE_PRUNE_UNTIL}"
          docker builder prune -a -f --filter "until=$${DOCKER_BUILDER_PRUNE_UNTIL}"
          docker system df
          sleep "$${DOCKER_CLEANUP_INTERVAL_SECONDS}"
        done
    logging: *json-logging

networks:
  public-core-gateway:
    enable_ipv6: false
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-most-pc
  prohelper-network:
    driver: bridge

volumes:
  clamav-data:
